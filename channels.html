<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТВ 34 - Плеер</title>
    <!-- Подключаем официальный SDK Яндекса -->
    <script src="https://yastatic.net/s3/passport-sdk/autofill/v1/sdk-suggest-with-polyfills-latest.js" crossorigin></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            margin: 0;
        }
        .auth-container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            max-width: 350px;
            margin: 50px auto;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .user-profile {
            display: none; 
            text-align: center;
        }
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 2px solid #fc3f1d;
        }
        .btn-logout {
            margin-top: 15px;
            padding: 8px 15px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-logout:hover {
            opacity: 0.9;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            margin: 15px 0 5px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-yandex { 
            background: #fc3f1d; 
            color: white; 
        }
        .btn-yandex:hover { 
            opacity: 0.9; 
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Блок входа -->
        <div id="login-form">
            <h3 style="margin-top: 0;">Вход в ТВ 34</h3>
            <p style="color: #aaa; font-size: 0.9em;">Войдите, чтобы сохранять избранные каналы</p>
            
            <!-- Кнопка Яндекса -->
            <button class="social-btn btn-yandex" onclick="loginWithYandex()">Войти через Яндекс</button>
        </div>

        <!-- Блок профиля (показывается после входа) -->
        <div id="user-profile" class="user-profile">
            <img id="user-photo" class="user-avatar" src="" alt="Аватар">
            <h4 id="user-name" style="margin: 10px 0 5px 0;">Привет!</h4>
            <p id="user-email" style="color: #888; font-size: 0.9em; margin: 0;"></p>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        // Ваши данные конфигурации
        const YANDEX_CLIENT_ID = '28a6b5cd362947b9a1115de32b6077b4';
        const REDIRECT_URI = window.location.origin + window.location.pathname; 

        window.onload = function() {
            checkAuthFromURL(); 
            renderProfileIfExists();
        };

        // Перенаправление на авторизацию Яндекса
        function loginWithYandex() {
            const yandexAuthUrl = `https://oauth.yandex.ru/authorize?response_type=token&client_id=${YANDEX_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = yandexAuthUrl;
        }

        // Проверка токена в адресной строке
        function checkAuthFromURL() {
            const hash = window.location.hash;
            const urlParams = new URLSearchParams(hash.replace('#', '?'));
            const token = urlParams.get('access_token');
            
            if (token) {
                fetchYandexUserInfo(token);
                cleanURL();
            }
        }

        // Запрос данных пользователя по токену через API Яндекса
        function fetchYandexUserInfo(token) {
            fetch('https://login.yandex.ru/info?format=json', {
                headers: {
                    'Authorization': `OAuth ${token}`
                }
            })
            .then(res => res.json())
            .then(data => {
                const user = {
                    name: data.real_name || data.display_name || 'Пользователь',
                    photo: data.default_avatar_id ? `https://avatars.yandex.net/get-yapic/${data.default_avatar_id}/islands-200` : 'https://via.placeholder.com/80',
                    email: data.default_email || ''
                };
                localStorage.setItem('tv34_user', JSON.stringify(user));
                renderProfileIfExists();
            })
            .catch(err => console.error('Ошибка получения данных Яндекса:', err));
        }

        // Отображение интерфейса в зависимости от того, вошел ли пользователь
        function renderProfileIfExists() {
            const savedUser = localStorage.getItem('tv34_user');
            const loginForm = document.getElementById('login-form');
            const userProfile = document.getElementById('user-profile');

            if (savedUser) {
                const user = JSON.parse(savedUser);
                document.getElementById('user-name').innerText = `Привет, ${user.name}!`;
                document.getElementById('user-photo').src = user.photo;
                document.getElementById('user-email').innerText = user.email;

                loginForm.style.display = 'none';
                userProfile.style.display = 'block';
            } else {
                loginForm.style.display = 'block';
                userProfile.style.display = 'none';
            }
        }

        // Выход из аккаунта
        function logout() {
            localStorage.removeItem('tv34_user');
            renderProfileIfExists();
        }

        // Очистка хеша в URL для красивого вида
        function cleanURL() {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
