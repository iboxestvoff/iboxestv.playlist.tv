<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТВ 34 — Онлайн Телевидение</title>
    <style>
        /* Основные стили интерфейса ТВ 34 */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff3333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff3333;
            text-transform: uppercase;
            text-decoration: none;
        }

        /* Блок профиля в шапке */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff3333;
            background-color: #333;
        }

        .user-name {
            font-weight: 500;
            font-size: 16px;
        }

        .auth-btn {
            background-color: #fc3f1d;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .auth-btn:hover {
            background-color: #e32b0f;
        }

        .logout-btn {
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .logout-btn:hover {
            color: #fff;
            border-color: #ff3333;
        }

        /* Стили контента и плеера */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .player-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            font-size: 18px;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта с сохранением интерфейса -->
    <header>
        <a href="/" class="logo">ТВ 34</a>
        
        <!-- Динамический блок авторизации -->
        <div id="auth-block">
            <button class="auth-btn" id="yandex-login-btn">Войти через Яндекс ID</button>
        </div>
    </header>

    <!-- Основной интерфейс каналов -->
    <main class="main-container">
        <div class="player-placeholder">
            Тут будет трансляция вашего телеканала (Выберите канал ниже)
        </div>
        
        <h3>Список доступных каналов</h3>
        <!-- Здесь ваш привычный список каналов/сеток -->
    </main>

<script>
    // Конфигурация Яндекс OAuth
    const YANDEX_CONFIG = {
        clientId: '0fc0a6b7929b4efdb1822f75b1c078b8',
        redirectUri: 'https://televizor34.onrender.com'
    };

    // Перенаправление на Яндекс для получения ТОКЕНА (Implicit Flow)
    function loginWithYandex() {
        const url = `https://oauth.yandex.ru/authorize?response_type=token&client_id=${YANDEX_CONFIG.clientId}&redirect_uri=${encodeURIComponent(YANDEX_CONFIG.redirectUri)}`;
        window.location.href = url;
    }

    // Функция запроса данных пользователя через API Яндекса
    async function fetchYandexUserInfo(token) {
        try {
            const response = await fetch('https://login.yandex.ru/info?format=json', {
                headers: {
                    'Authorization': `OAuth ${token}`
                }
            });

            if (!response.ok) throw new Error('Не удалось получить данные профиля');

            const data = await response.json();
            renderProfile(data);
        } catch (error) {
            console.error('Ошибка Яндекса:', error);
            // Если токен протух или неверный, возвращаем кнопку входа
            renderAuthButton();
        }
    }

    // Отображение профиля (Ник + Аватарка) в шапке
    function renderProfile(user) {
        const authBlock = document.getElementById('auth-block');
        
        // Яндекс возвращает ID дефолтной аватарки. Ссылка собирается так:
        const avatarUrl = user.is_avatar_empty 
            ? 'https://yapx.ru/assets/images/noavatar.png' // заглушка, если нет фото
            : `https://avatars.yandex.net/get-yapic/${user.default_avatar_id}/islands-200`;

        const displayName = user.display_name || user.login;

        authBlock.innerHTML = `
            <div class="user-profile">
                <img src="${avatarUrl}" class="user-avatar" alt="Аватар">
                <span class="user-name">${displayName}</span>
                <button class="logout-btn" id="logout-btn">Выйти</button>
            </div>
        `;

        document.getElementById('logout-btn').addEventListener('click', logout);
    }

    // Возврат к кнопке "Войти"
    function renderAuthButton() {
        const authBlock = document.getElementById('auth-block');
        authBlock.innerHTML = `<button class="auth-btn" id="yandex-login-btn">Войти через Яндекс ID</button>`;
        document.getElementById('yandex-login-btn').addEventListener('click', loginWithYandex);
    }

    // Выход из аккаунта
    function logout() {
        localStorage.removeItem('yx_token');
        renderAuthButton();
    }

    // Проверка при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
        // 1. Проверяем, пришел ли токен в хэше URL после редиректа Яндекса
        const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
        let token = hashParams.get('access_token');

        if (token) {
            // Сохраняем токен, чтобы пользователю не нужно было входить каждый раз
            localStorage.setItem('yx_token', token);
            // Очищаем хэш в URL для красоты
            window.history.replaceState({}, document.title, window.location.pathname);
        } else {
            // 2. Если в URL нет токена, ищем его в локальной памяти
            token = localStorage.getItem('yx_token');
        }

        // Если токен есть — запрашиваем ник и аватарку, если нет — вешаем событие на кнопку
        if (token) {
            fetchYandexUserInfo(token);
        } else {
            renderAuthButton();
        }
    });
</script>

</body>
</html>
