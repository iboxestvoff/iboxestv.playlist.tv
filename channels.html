мму.'); return; } const ch = channels[currentIndex]; const chId = epgChannelIdForIndex.get(currentIndex); if(!chId){ setEpgStatus('Для канала «' + ch.name + '» данных в этой телепрограмме не нашлось.'); return; } const programs = epgData.programsByChannelId.get(chId) || []; const now = new Date(); const body = programs.length === 0 ? '<div class="rail-status">Нет данных о программе.</div>' : programs.map(p => { const isNow = p.start <= now && now < p.stop; return '<div class="program-row' + (isNow ? ' now' : '') + '">' + '<span class="program-time">' + fmtTime(p.start) + '</span>' + '<span class="program-title">' + escapeHtml(p.title) + (isNow ? ' <span class="now-tag">СЕЙЧАС</span>' : '') + '</span>' + '</div>'; }).join(''); const html = '<div class="epg-channel-title">' + escapeHtml(ch.name) + '</div>' + body; els.epgPanelDesktop.innerHTML = html; els.epgPanelMobile.innerHTML = html; } async function loadEpg(url){ if(!url){ setEpgStatus('Укажите ссылку на EPG (XMLTV).', true); return; } setEpgStatus('Загрузка телепрограммы… файл может быть большим (десятки МБ), это может занять время.'); els.epgLoadBtn.disabled = true; try{ const res = await fetch(url, { cache: 'no-store' }); if(!res.ok) throw new Error('HTTP ' + res.status); const text = await res.text(); const xml = new DOMParser().parseFromString(text, 'application/xml'); if(xml.querySelector('parsererror')) throw new Error('не удалось разобрать XML-файл'); const programsByChannelId = new Map(); xml.querySelectorAll('programme').forEach(p => { const chId = p.getAttribute('channel'); const start = parseXmltvTime(p.getAttribute('start')); const stop = parseXmltvTime(p.getAttribute('stop')); if(!chId || !start || !stop) return; const titleEl = p.querySelector('title'); const title = titleEl ? titleEl.textContent.trim() : 'Без названия'; if(!programsByChannelId.has(chId)) programsByChannelId.set(chId, []); programsByChannelId.get(chId).push({ start, stop, title }); }); programsByChannelId.forEach(list => list.sort((a, b) => a.start - b.start)); const idByNormalizedName = new Map(); xml.querySelectorAll('channel').forEach(c => { const id = c.getAttribute('id'); if(!id) return; c.querySelectorAll('display-name').forEach(dn => { const norm = normalizeName(dn.textContent || ''); if(norm && !idByNormalizedName.has(norm)) idByNormalizedName.set(norm, id); }); }); if(programsByChannelId.size === 0) throw new Error('в файле не нашлось ни одной передачи (<programme>)'); epgData = { idByNormalizedName, programsByChannelId }; buildEpgMatches(); renderEpgPanels(); }catch(err){ console.error(err); epgData = null; setEpgStatus('Не удалось загрузить телепрограмму: ' + err.message + '. Возможно, сервер блокирует запросы из браузера (CORS).', true); }finally{ els.epgLoadBtn.disabled = false; } } function parseM3U(text){ const lines = text.split(/\r?\n/); const result = []; let pending = null; for(let raw of lines){ const line = raw.trim(); if(!line) continue; if(line.startsWith('#EXTINF')){ const groupMatch = line.match(/group-title="([^"]*)"/); const logoMatch = line.match(/tvg-logo="([^"]*)"/); const idMatch = line.match(/tvg-id="([^"]*)"/); const nameMatch = line.match(/,(.*)$/); pending = { group: groupMatch ? (groupMatch[1].trim() || 'Без категории') : 'Без категории', logo: logoMatch ? logoMatch[1] : null, tvgId: idMatch ? idMatch[1] : null, name: nameMatch ? nameMatch[1].trim() : 'Канал', }; } else if(line.startsWith('#')){ continue; } else if(pending){ pending.url = line; result.push(pending); pending = null; } } return result; } function setStatus(text, isError){ els.status.textContent = text; els.status.classList.toggle('error', !!isError); } async function fetchPlaylist(url){ if(!url){ setStatus('Укажите ссылку на плейлист.', true); return; } setStatus('Загрузка плейлиста…'); els.groups.innerHTML = ''; try{ const res = await fetch(url, { cache: 'no-store' }); if(!res.ok) throw new Error('HTTP ' + res.status); const text = await res.text(); const epgMatch = text.match(/url-tvg="([^"]*)"/i) || text.match(/x-tvg-url="([^"]*)"/i); if(epgMatch && !els.epgUrlInput.value){ els.epgUrlInput.value = epgMatch[1]; } const parsed = parseM3U(text); if(parsed.length === 0) throw new Error('в файле не найдено ни одного канала (#EXTINF)'); channels = parsed; renderGroups(channels); setStatus(channels.length + ' каналов загружено'); }catch(err){ console.error(err); setStatus('Не удалось загрузить плейлист: ' + err.message, true); } } function renderGroups(list){ const byGroup = new Map(); list.forEach((ch, i) => { ch.number = String(i + 1).padStart(3, '0'); if(!byGroup.has(ch.group)) byGroup.set(ch.group, []); byGroup.get(ch.group).push(i); }); els.groups.innerHTML = ''; let first = true; for(const [group, indices] of byGroup){ const details = document.createElement('details'); details.open = first; first = false; const summary = document.createElement('summary'); summary.innerHTML = '<span>' + escapeHtml(group) + '</span><span class="group-count">' + indices.length + '</span>'; details.appendChild(summary); const ul = document.createElement('ul'); ul.className = 'channel-list'; indices.forEach(idx => { const ch = list[idx]; const li = document.createElement('li'); const btn = document.createElement('button'); btn.className = 'channel-btn'; btn.dataset.index = idx; const radioTag = isAudioUrl(ch.url) ? '<span class="ch-tag">FM</span>' : ''; btn.innerHTML = logoHtml(ch) + '<span class="ch-num">' + ch.number + '</span><span class="ch-name">' + escapeHtml(ch.name) + '</span>' + radioTag; btn.addEventListener('click', () => playChannel(idx)); li.appendChild(btn); ul.appendChild(li); }); details.appendChild(ul); els.groups.appendChild(details); } renderCategoryList(byGroup); mobileCategoryFilter = null; els.mobileFilterChip.classList.add('hidden'); setMobileTab('channels'); updateMobileChannelList(); buildEpgMatches(); renderEpgPanels(); } function renderCategoryList(byGroup){ els.mobileCategoryList.innerHTML = ''; for(const [group, indices] of byGroup){ const btn = document.createElement('button'); btn.className = 'mobile-category-row'; btn.dataset.group = group; btn.innerHTML = '<span class="cat-icon"><span></span><span></span><span></span><span></span></span>' + '<span class="cat-name">' + escapeHtml(group) + '</span>' + '<span class="cat-count">' + indices.length + '</span>'; els.mobileCategoryList.appendChild(btn); } } function renderMobileChannelList(indices){ if(indices.length === 0){ els.mobileChannelList.innerHTML = '<div class="rail-status">Каналы не найдены</div>'; return; } els.mobileChannelList.innerHTML = indices.map(i => { const ch = channels[i]; const radioTag = isAudioUrl(ch.url) ? '<span class="ch-tag">FM</span>' : ''; return '<button class="mobile-row" data-index="' + i + '">' + logoHtml(ch) + '<span class="ch-row-name">' + escapeHtml(ch.name) + '</span>' + radioTag + '</button>'; }).join(''); } function updateMobileChannelList(){ const q = els.searchInput.value.trim().toLowerCase(); const indices = []; channels.forEach((ch, i) => { if(mobileCategoryFilter && ch.group !== mobileCategoryFilter) return; if(q && !ch.name.toLowerCase().includes(q)) return; indices.push(i); }); renderMobileChannelList(indices); } function setMobileTab(tab){ els.tabChannelsBtn.classList.toggle('active', tab === 'channels'); els.tabCategoriesBtn.classList.toggle('active', tab === 'categories'); els.tabProgramBtn.classList.toggle('active', tab === 'program'); els.mobileChannelList.classList.toggle('hidden', tab !== 'channels'); els.mobileCategoryList.classList.toggle('hidden', tab !== 'categories'); els.epgPanelMobile.classList.toggle('hidden', tab !== 'program'); } function selectCategory(group){ mobileCategoryFilter = group; els.mobileFilterLabel.textContent = group; els.mobileFilterChip.classList.remove('hidden'); updateMobileChannelList(); setMobileTab('channels'); } function highlightActive(index){ document.querySelectorAll('[data-index].active').forEach(b => b.classList.remove('active')); document.querySelectorAll('[data-index="' + index + '"]').forEach(b => { b.classList.add('active'); b.scrollIntoView({ block: 'nearest' }); }); } function showOSD(ch){ clearTimeout(osdTimer); els.osdNum.textContent = ch.number; els.osdName.textContent = ch.name; els.osdGroup.textContent = ch.group; els.osd.classList.remove('hidden'); els.osd.style.animation = 'none'; requestAnimationFrame(() => { els.osd.style.animation = ''; }); osdTimer = setTimeout(() => els.osd.classList.add('hidden'), 3200); } function describeHlsError(data){ if(data && data.type === 'networkError'){ return 'Сервер потока не отвечает или блокирует браузерные запросы (CORS). Такие каналы часто работают в VLC/IPTV-плеере, но не в браузере.'; } if(data && data.type === 'mediaError'){ return 'Поток повреждён или формат не поддерживается браузером.'; } return 'Не удалось воспроизвести этот канал.'; } function showError(message){ els.loading.classList.add('hidden'); els.errorDetail.textContent = message; els.errorBox.classList.remove('hidden'); } function stopAll(){ if(hls){ hls.destroy(); hls = null; } els.video.removeAttribute('src'); els.video.load(); els.audioEl.pause(); els.audioEl.removeAttribute('src'); } function playChannel(index){ const ch = channels[index]; if(!ch) return; currentIndex = index; highlightActive(index); showOSD(ch); setRailOpen(false); renderEpgPanels(); els.placeholder.classList.add('hidden'); els.errorBox.classList.add('hidden'); stopAll(); if(isAudioUrl(ch.url)){ els.video.classList.add('hidden'); els.audioFace.classList.remove('hidden'); els.audioEl.classList.remove('hidden'); els.audioEl.src = ch.url; els.audioEl.play().catch(err => showError('Радиопоток не воспроизводится: ' + err.message)); } else { els.audioFace.classList.add('hidden'); els.audioEl.classList.add('hidden'); els.video.classList.remove('hidden'); playVideo(ch.url); } } function playVideo(url){ els.loading.classList.remove('hidden'); if(window.Hls && Hls.isSupported()){ hls = new Hls({ enableWorker: true }); hls.loadSource(url); hls.attachMedia(els.video); hls.on(Hls.Events.MANIFEST_PARSED, () => { els.loading.classList.add('hidden'); els.video.play().catch(() => {}); }); hls.on(Hls.Events.ERROR, (_evt, data) => { if(data.fatal){ showError(describeHlsError(data)); } }); } else if(els.video.canPlayType('application/vnd.apple.mpegurl')){ els.video.src = url; els.video.addEventListener('loadedmetadata', () => els.loading.classList.add('hidden'), { once: true }); els.video.play().catch(err => showError('Не удалось запустить поток: ' + err.message)); } else { showError('Браузер не поддерживает воспроизведение HLS-потоков.'); } } els.video.addEventListener('error', () => { if(!hls) showError('Не удалось воспроизвести этот канал.'); }); els.retryBtn.addEventListener('click', () => { if(currentIndex >= 0) playChannel(currentIndex); }); els.nextBtn.addEventListener('click', () => { if(currentIndex + 1 < channels.length) playChannel(currentIndex + 1); }); els.playlistSelect.addEventListener('change', () => { els.customUrl.classList.toggle('hidden', els.playlistSelect.value !== 'custom'); }); els.loadBtn.addEventListener('click', () => { const val = els.playlistSelect.value; const url = val === 'custom' ? els.customUrl.value.trim() : PLAYLISTS[val]; fetchPlaylist(url); }); els.searchInput.addEventListener('input', () => { const q = els.searchInput.value.trim().toLowerCase(); document.querySelectorAll('#groups details').forEach(details => { let anyVisible = false; details.querySelectorAll('.channel-list > li').forEach(li => { const name = li.querySelector('.ch-name').textContent.toLowerCase(); const match = name.includes(q); li.style.display = match ? '' : 'none'; if(match) anyVisible = true; }); details.style.display = anyVisible ? '' : 'none'; if(q) details.open = anyVisible; }); updateMobileChannelList(); }); els.tabChannelsBtn.addEventListener('click', () => setMobileTab('channels')); els.tabCategoriesBtn.addEventListener('click', () => setMobileTab('categories')); els.tabProgramBtn.addEventListener('click', () => setMobileTab('program')); els.epgLoadBtn.addEventListener('click', () => loadEpg(els.epgUrlInput.value.trim())); els.mobileFilterClear.addEventListener('click', () => { mobileCategoryFilter = null; els.mobileFilterChip.classList.add('hidden'); updateMobileChannelList(); }); els.mobileChannelList.addEventListener('click', (e) => { const btn = e.target.closest('.mobile-row'); if(btn) playChannel(Number(btn.dataset.index)); }); els.mobileCategoryList.addEventListener('click', (e) => { const btn = e.target.closest('.mobile-category-row'); if(btn) selectCategory(btn.dataset.group); }); function setRailOpen(open){ els.rail.classList.toggle('open', open); els.railToggle.setAttribute('aria-expanded', String(open)); els.railToggle.textContent = open ? '✕ Закрыть' : '☰ Список каналов'; els.railBackdrop.classList.toggle('hidden', !open); } els.railToggle.addEventListener('click', () => { setRailOpen(!els.rail.classList.contains('open')); }); els.railBackdrop.addEventListener('click', () => setRailOpen(false)); document.addEventListener('keydown', (e) => { if(e.key === 'Escape') setRailOpen(false); }); fetchPlaylist(PLAYLISTS.main); </script> </body> </html>
