<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Телевизор 34 — веб-плеер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e1014;
    --panel: #161922;
    --panel-2: #1c2029;
    --line: #272c37;
    --text: #eceef2;
    --muted: #868d9c;
    --accent: #ffb13d;
    --accent-dim: #6b5226;
    --live: #ff5d5d;
    --focus: #5fb4ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Header / OSD bar ---------- */
  .osd-bar{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    padding:12px 20px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  .brand-mark{color:var(--live); font-size:12px; vertical-align:2px;}
  .accent{color:var(--accent);}
  .controls-row{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    flex:1;
  }
  select, input[type="url"], input[type="search"]{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
  }
  select{cursor:pointer;}
  input[type="search"]{min-width:160px;}
  .btn{
    background:var(--accent);
    color:#1a1206;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08);}
  .hidden{display:none !important;}
  .search-wrap{margin-left:auto;}

  /* ---------- Body layout ---------- */
  .body-grid{
    flex:1;
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:0;
  }
  .rail-toggle{
    display:none;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    margin:10px;
    width:fit-content;
    cursor:pointer;
  }

  .channel-rail{
    background:var(--panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:10px;
  }
  .rail-status{
    color:var(--muted);
    font-size:13px;
    padding:6px 8px 12px;
  }
  .rail-status.error{color:var(--live);}

  details{
    border-bottom:1px solid var(--line);
  }
  summary{
    list-style:none;
    cursor:pointer;
    padding:10px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--muted);
  }
  summary::-webkit-details-marker{display:none;}
  summary:hover{color:var(--text);}
  .group-count{
    font-family:'Space Mono',monospace;
    color:var(--accent);
    font-size:12px;
  }
  .channel-list{
    list-style:none;
    margin:0 0 6px;
    padding:0;
  }
  .channel-btn{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:transparent;
    border:none;
    color:var(--text);
    text-align:left;
    padding:8px 8px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
  }
  .channel-btn:hover{background:var(--panel-2);}
  .channel-btn.active{background:var(--accent-dim); color:var(--accent);}
  .ch-num{
    font-family:'Space Mono',monospace;
    color:var(--muted);
    font-size:12px;
    width:28px;
    flex-shrink:0;
  }
  .channel-btn.active .ch-num{color:var(--accent);}
  .channel-btn .ch-logo{width:26px; height:26px; border-radius:6px;}
  .channel-btn .ch-logo-fallback{font-size:10px;}
  .ch-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .ch-tag{
    font-size:10px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
    color:var(--muted);
    flex-shrink:0;
  }

  /* ---------- Screen ---------- */
  .screen-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    min-height:0;
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  video{
    width:100%;
    height:100%;
    background:#000;
    object-fit:contain;
  }
  .audio-face{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    color:var(--muted);
  }
  .bars{display:flex; gap:6px; align-items:flex-end; height:48px;}
  .bars span{
    width:6px;
    background:var(--accent);
    border-radius:2px;
    animation:bounce 1s infinite ease-in-out;
  }
  .bars span:nth-child(1){height:20%; animation-delay:0s;}
  .bars span:nth-child(2){height:60%; animation-delay:0.1s;}
  .bars span:nth-child(3){height:100%; animation-delay:0.2s;}
  .bars span:nth-child(4){height:50%; animation-delay:0.3s;}
  .bars span:nth-child(5){height:80%; animation-delay:0.4s;}
  @keyframes bounce{0%,100%{transform:scaleY(0.3);} 50%{transform:scaleY(1);}}
  .audio-label{
    font-family:'Space Mono',monospace;
    letter-spacing:2px;
    font-size:13px;
  }

  .placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    gap:8px;
    pointer-events:none;
  }
  .placeholder-num{
    font-family:'Space Mono',monospace;
    font-size:42px;
    color:var(--line);
  }
  .placeholder-text{font-size:14px;}

  .loading{
    position:absolute;
    bottom:18px;
    left:18px;
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--accent);
    background:rgba(0,0,0,0.6);
    padding:5px 10px;
    border-radius:6px;
  }

  .osd{
    position:absolute;
    top:18px;
    left:18px;
    background:rgba(10,10,14,0.78);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    display:flex;
    align-items:baseline;
    gap:10px;
    animation:osdFade 3.2s forwards;
    pointer-events:none;
  }
  @keyframes osdFade{
    0%{opacity:1;}
    70%{opacity:1;}
    100%{opacity:0;}
  }
  .osd-num{
    font-family:'Space Mono',monospace;
    font-size:22px;
    font-weight:700;
    color:var(--accent);
  }
  .osd-name{font-size:16px; font-weight:600;}
  .osd-group{font-size:12px; color:var(--muted);}

  .error-box{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(0,0,0,0.85);
    text-align:center;
    padding:20px;
  }
  .error-title{color:var(--live); font-weight:700; font-size:16px;}
  .error-detail{color:var(--muted); font-size:13px; max-width:380px;}
  .error-actions{display:flex; gap:10px;}
  .error-actions button{
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
    font-size:13px;
  }
  .error-actions button:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- Mobile stacked panel (video on top, tabs + list below) ---------- */
  .mobile-panel{display:none;}
  .mobile-tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .mobile-tab{
    flex:1;
    background:transparent;
    border:none;
    color:var(--muted);
    padding:12px 10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .mobile-tab.active{color:var(--accent); border-bottom-color:var(--accent);}
  .mobile-filter-chip{
    display:flex;
    align-items:center;
    gap:8px;
    margin:10px 12px 0;
    padding:6px 10px;
    background:var(--accent-dim);
    color:var(--accent);
    border-radius:999px;
    font-size:13px;
    width:fit-content;
    flex-shrink:0;
  }
  .mobile-filter-chip button{
    background:transparent;
    border:none;
    color:var(--accent);
    cursor:pointer;
    font-size:13px;
    line-height:1;
    padding:0;
  }
  .mobile-channel-list, .mobile-category-list, #epgPanelMobile{
    overflow-y:auto;
    flex:1;
    min-height:0;
    padding:8px;
  }
  .mobile-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:transparent;
    border:none;
    border-radius:10px;
    padding:9px 10px;
    margin-bottom:4px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
  }
  .mobile-row:hover{background:var(--panel-2);}
  .mobile-row.active{background:var(--accent-dim); box-shadow:inset 0 0 0 1px var(--accent);}
  .mobile-row.active .ch-row-name{color:var(--accent);}
  .ch-logo{
    width:42px;
    height:42px;
    border-radius:9px;
    flex-shrink:0;
    overflow:hidden;
    position:relative;
  }
  .ch-logo img{width:100%; height:100%; object-fit:cover; display:block;}
  .ch-logo-fallback{
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:13px;
  }
  .ch-row-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14.5px;
  }
  .mobile-category-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    background:transparent;
    border:none;
    border-radius:10px;
    padding:13px 10px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    font-size:15px;
  }
  .mobile-category-row:hover{background:var(--panel-2);}
  .cat-icon{
    width:14px;
    height:14px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:3px;
    flex-shrink:0;
  }
  .cat-icon span{width:4px; height:4px; border-radius:50%; background:var(--muted);}
  .cat-name{flex:1;}
  .cat-count{font-family:'Space Mono',monospace; font-size:12px; color:var(--muted);}

  /* ---------- TV guide (EPG) ---------- */
  .epg-panel{padding:6px 4px;}
  .epg-channel-title{
    font-weight:700;
    color:var(--accent);
    font-size:14px;
    padding:2px 4px 10px;
  }
  .program-row{
    display:flex;
    gap:10px;
    padding:7px 4px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    border-radius:6px;
  }
  .program-time{
    font-family:'Space Mono',monospace;
    color:var(--muted);
    flex-shrink:0;
    width:42px;
  }
  .program-title{flex:1;}
  .program-row.now{background:var(--accent-dim);}
  .program-row.now .program-time{color:var(--accent);}
  .now-tag{
    font-size:10px;
    color:var(--live);
    border:1px solid var(--live);
    border-radius:4px;
    padding:1px 4px;
    margin-left:6px;
  }
  .program-progress{
    height:4px;
    background:var(--line);
    border-radius:2px;
    margin:6px 4px 14px;
    overflow:hidden;
  }
  .program-progress-bar{
    height:100%;
    background:var(--accent);
    border-radius:2px;
  }
  .program-row.next-row{
    opacity:0.75;
    border-bottom:none;
  }
  .program-row.next-row .program-time{color:var(--muted);}

  /* ---------- Recording ---------- */
  .record-controls{
    position:absolute;
    top:18px;
    right:18px;
    display:flex;
    align-items:center;
    gap:8px;
    z-index:5;
  }
  .record-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(10,10,14,0.78);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:999px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .record-btn:hover{border-color:var(--live);}
  .record-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--live);
    flex-shrink:0;
  }
  .record-btn.active{
    background:rgba(255,93,93,0.18);
    border-color:var(--live);
    color:var(--live);
  }
  .record-btn.active .record-dot{animation:recPulse 1s infinite;}
  @keyframes recPulse{0%,100%{opacity:1;} 50%{opacity:0.25;}}
  .record-timer{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--live);
    background:rgba(10,10,14,0.78);
    padding:4px 8px;
    border-radius:6px;
  }
  .toast{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(10,10,14,0.92);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    max-width:80%;
    text-align:center;
    z-index:6;
  }
  .toast.error{border-color:var(--live); color:var(--live);}

  /* ---------- Responsive ---------- */
  .rail-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:15;
  }

  @media (max-width:880px){
    .rail-toggle, .rail-backdrop, .channel-rail{ display:none !important; }
    .body-grid{
      display:flex;
      flex-direction:column;
    }
    .screen-wrap{
      flex:none;
      width:100%;
      aspect-ratio:16/9;
    }
    .mobile-panel{
      display:flex;
      flex-direction:column;
      flex:1;
      min-height:0;
    }
    .search-wrap{margin-left:0; width:100%;}
    .controls-row{width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="osd-bar">
    <div class="brand"><span class="brand-mark">●</span> ТЕЛЕВИЗОР <span class="accent">34</span></div>
    <div class="controls-row">
      <select id="playlistSelect" aria-label="Выбор плейлиста">
        <option value="main">Основной плейлист</option>
        <option value="kids">Детский плейлист</option>
        <option value="custom">Своя ссылка…</option>
      </select>
      <input id="customUrl" type="url" class="hidden" placeholder="https://.../playlist.m3u" />
      <button id="loadBtn" class="btn">Загрузить</button>
      <input id="epgUrlInput" type="url" class="hidden" placeholder="Ссылка на EPG (XMLTV)" value="https://raw.githubusercontent.com/iboxestvoff/iboxestv.playlist.tv/epg-data/epg.xml" style="min-width:190px;" />
      <button id="epgLoadBtn" class="btn hidden">Загрузить программу</button>
      <button id="epgFileBtn" class="btn hidden" type="button" title="Надёжный способ, не зависит от CORS">Файл с компьютера</button>
      <input id="epgFileInput" type="file" accept=".xml,.txt,application/xml,text/xml" class="hidden" />
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Поиск канала…" aria-label="Поиск канала" />
      </div>
    </div>
  </header>

  <div class="body-grid">
    <button id="railToggle" class="rail-toggle" aria-expanded="false">☰ Список каналов</button>
    <div id="railBackdrop" class="rail-backdrop hidden"></div>

    <aside id="rail" class="channel-rail">
      <div id="status" class="rail-status">Загрузка плейлиста…</div>
      <details id="epgDetails" class="epg-details">
        <summary><span>Телепрограмма</span></summary>
        <div id="epgPanelDesktop" class="epg-panel"></div>
      </details>
      <div id="groups" class="groups"></div>
    </aside>

    <main class="screen-wrap">
      <div class="screen">
        <video id="video" class="hidden" playsinline controls crossorigin="anonymous"></video>
        <audio id="audioEl" class="hidden" crossorigin="anonymous"></audio>

        <div id="audioFace" class="audio-face hidden">
          <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="audio-label">РАДИО — ИДЁТ ЭФИР</div>
        </div>

        <div id="recordControls" class="record-controls">
          <button id="recordBtn" class="record-btn" type="button" title="Записать эфир">
            <span class="record-dot"></span>
            <span id="recordLabel">Запись</span>
          </button>
          <span id="recordTimer" class="record-timer hidden">00:00</span>
        </div>

        <div id="toast" class="toast hidden"></div>

        <div id="osd" class="osd hidden">
          <span id="osdNum" class="osd-num"></span>
          <span id="osdName" class="osd-name"></span>
          <span id="osdGroup" class="osd-group"></span>
        </div>

        <div id="placeholder" class="placeholder">
          <div class="placeholder-num">000</div>
          <div class="placeholder-text">Выберите канал из списка слева</div>
        </div>

        <div id="loading" class="loading hidden">Подключение…</div>

        <div id="errorBox" class="error-box hidden">
          <div class="error-title">Канал недоступен</div>
          <div class="error-detail" id="errorDetail"></div>
          <div class="error-actions">
            <button id="retryBtn">Повторить</button>
            <button id="nextBtn">Следующий канал</button>
          </div>
        </div>
      </div>
    </main>

    <div id="mobilePanel" class="mobile-panel">
      <div class="mobile-tabs">
        <button id="tabChannelsBtn" class="mobile-tab active" type="button">Каналы</button>
        <button id="tabCategoriesBtn" class="mobile-tab" type="button">Категории</button>
        <button id="tabProgramBtn" class="mobile-tab" type="button">Программа</button>
      </div>
      <div id="mobileFilterChip" class="mobile-filter-chip hidden">
        <span id="mobileFilterLabel"></span>
        <button id="mobileFilterClear" type="button" aria-label="Сбросить категорию">✕</button>
      </div>
      <div id="mobileChannelList" class="mobile-channel-list"></div>
      <div id="mobileCategoryList" class="mobile-category-list hidden"></div>
      <div id="epgPanelMobile" class="epg-panel hidden"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
  const PLAYLISTS = {
    main: 'https://raw.githubusercontent.com/iboxestvoff/iboxestv.playlist.tv/main/playlist.m3u',
    kids: 'https://raw.githubusercontent.com/iboxestvoff/iboxestv.playlist.tv/main/kids_playlist.m3u',
  };

  const els = {
    playlistSelect: document.getElementById('playlistSelect'),
    customUrl: document.getElementById('customUrl'),
    loadBtn: document.getElementById('loadBtn'),
    searchInput: document.getElementById('searchInput'),
    status: document.getElementById('status'),
    groups: document.getElementById('groups'),
    rail: document.getElementById('rail'),
    railToggle: document.getElementById('railToggle'),
    railBackdrop: document.getElementById('railBackdrop'),
    video: document.getElementById('video'),
    audioEl: document.getElementById('audioEl'),
    audioFace: document.getElementById('audioFace'),
    osd: document.getElementById('osd'),
    osdNum: document.getElementById('osdNum'),
    osdName: document.getElementById('osdName'),
    osdGroup: document.getElementById('osdGroup'),
    placeholder: document.getElementById('placeholder'),
    loading: document.getElementById('loading'),
    errorBox: document.getElementById('errorBox'),
    errorDetail: document.getElementById('errorDetail'),
    retryBtn: document.getElementById('retryBtn'),
    nextBtn: document.getElementById('nextBtn'),
    tabChannelsBtn: document.getElementById('tabChannelsBtn'),
    tabCategoriesBtn: document.getElementById('tabCategoriesBtn'),
    mobileFilterChip: document.getElementById('mobileFilterChip'),
    mobileFilterLabel: document.getElementById('mobileFilterLabel'),
    mobileFilterClear: document.getElementById('mobileFilterClear'),
    mobileChannelList: document.getElementById('mobileChannelList'),
    mobileCategoryList: document.getElementById('mobileCategoryList'),
    tabProgramBtn: document.getElementById('tabProgramBtn'),
    epgUrlInput: document.getElementById('epgUrlInput'),
    epgLoadBtn: document.getElementById('epgLoadBtn'),
    epgFileBtn: document.getElementById('epgFileBtn'),
    epgFileInput: document.getElementById('epgFileInput'),
    epgPanelDesktop: document.getElementById('epgPanelDesktop'),
    epgPanelMobile: document.getElementById('epgPanelMobile'),
    recordBtn: document.getElementById('recordBtn'),
    recordLabel: document.getElementById('recordLabel'),
    recordTimer: document.getElementById('recordTimer'),
    toast: document.getElementById('toast'),
  };

  let mobileCategoryFilter = null;
  let epgData = null;
  let epgChannelIdForIndex = new Map();
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordStartTime = null;
  let recordTimerHandle = null;
  let toastHandle = null;

  let channels = [];
  let hls = null;
  let currentIndex = -1;
  let osdTimer = null;

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function isAudioUrl(url){
    return /\.(mp3|aac)(\?|$)/i.test(url);
  }

  function nameColor(name){
    let hash = 0;
    for(let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;
    return 'hsl(' + (Math.abs(hash) % 360) + ',55%,40%)';
  }

  function initials(name){
    const words = name.trim().split(/\s+/).filter(Boolean);
    if(words.length === 0) return '?';
    if(words.length === 1) return words[0].slice(0, 3).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function logoHtml(ch){
    const color = nameColor(ch.name);
    const init = escapeHtml(initials(ch.name));
    const fallback = '<span class="ch-logo-fallback" style="display:' + (ch.logo ? 'none' : 'flex') + '">' + init + '</span>';
    const img = ch.logo
      ? '<img src="' + escapeHtml(ch.logo) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
      : '';
    return '<span class="ch-logo" style="background:' + color + '">' + img + fallback + '</span>';
  }

  function normalizeName(s){
    return (s || '').toLowerCase().replace(/[^a-zа-яё0-9]/gi, '');
  }

  function parseXmltvTime(s){
    if(!s) return null;
    const m = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{2})?(\d{2})?/);
    if(!m) return null;
    const [, Y, Mo, D, H, Mi, S, offH, offM] = m;
    let ms = Date.UTC(+Y, +Mo - 1, +D, +H, +Mi, +S);
    if(offH){
      const sign = offH[0] === '-' ? -1 : 1;
      const offsetMinutes = sign * (parseInt(offH.slice(1), 10) * 60 + (offM ? parseInt(offM, 10) : 0));
      ms -= offsetMinutes * 60000;
    }
    return new Date(ms);
  }

  function fmtTime(d){
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function buildEpgMatches(){
    epgChannelIdForIndex = new Map();
    if(!epgData) return;
    channels.forEach((ch, i) => {
      let id = null;
      if(ch.tvgId && epgData.programsByChannelId.has(ch.tvgId)) id = ch.tvgId;
      if(!id){
        const norm = normalizeName(ch.name);
        id = epgData.idByNormalizedName.get(norm) || null;
      }
      epgChannelIdForIndex.set(i, id);
    });
  }

  function setEpgStatus(msg, isError){
    const html = '<div class="rail-status' + (isError ? ' error' : '') + '">' + escapeHtml(msg) + '</div>';
    els.epgPanelDesktop.innerHTML = html;
    els.epgPanelMobile.innerHTML = html;
  }

  function renderEpgPanels(){
    if(!epgData){
      setEpgStatus('Телепрограмма не загружена.');
      return;
    }
    if(currentIndex < 0){
      setEpgStatus('Выберите канал, чтобы увидеть программу.');
      return;
    }
    const ch = channels[currentIndex];
    const chId = epgChannelIdForIndex.get(currentIndex);
    if(!chId){
      setEpgStatus('Для канала «' + ch.name + '» данных в этой телепрограмме не нашлось.');
      return;
    }
    const programs = epgData.programsByChannelId.get(chId) || [];
    const now = new Date();
    const idx = programs.findIndex(p => p.start <= now && now < p.stop);
    const current = idx >= 0 ? programs[idx] : null;
    const next = idx >= 0 && idx + 1 < programs.length ? programs[idx + 1] : null;

    let body;
    if(!current){
      body = '<div class="rail-status">Нет данных о текущей передаче.</div>';
    } else {
      const totalMs = current.stop - current.start;
      const elapsedMs = now - current.start;
      const pct = totalMs > 0 ? Math.min(100, Math.max(0, Math.round(elapsedMs / totalMs * 100))) : 0;
      body =
        '<div class="program-row now">' +
          '<span class="program-time">' + fmtTime(current.start) + '–' + fmtTime(current.stop) + '</span>' +
          '<span class="program-title">' + escapeHtml(current.title) + ' <span class="now-tag">СЕЙЧАС</span></span>' +
        '</div>' +
        '<div class="program-progress"><div class="program-progress-bar" style="width:' + pct + '%"></div></div>' +
        (next
          ? '<div class="program-row next-row">' +
              '<span class="program-time">' + fmtTime(next.start) + '</span>' +
              '<span class="program-title">Далее: ' + escapeHtml(next.title) + '</span>' +
            '</div>'
          : '');
    }
    const html = '<div class="epg-channel-title">' + escapeHtml(ch.name) + '</div>' + body;
    els.epgPanelDesktop.innerHTML = html;
    els.epgPanelMobile.innerHTML = html;
  }

  async function readEpgResponseText(res, onProgress){
    const totalHeader = res.headers.get('content-length');
    const total = totalHeader ? parseInt(totalHeader, 10) : 0;

    let bytes;
    if(res.body && typeof res.body.getReader === 'function'){
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        chunks.push(value);
        received += value.length;
        if(onProgress) onProgress(received, total);
      }
      bytes = new Uint8Array(received);
      let offset = 0;
      for(const chunk of chunks){
        bytes.set(chunk, offset);
        offset += chunk.length;
      }
    } else {
      bytes = new Uint8Array(await res.arrayBuffer());
      if(onProgress) onProgress(bytes.length, bytes.length);
    }

    const isGzip = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
    if(isGzip){
      if(typeof DecompressionStream === 'undefined'){
        throw new Error('файл сжат gzip, а браузер не поддерживает его распаковку (DecompressionStream)');
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const decompressedBuf = await new Response(stream).arrayBuffer();
      return new TextDecoder('utf-8').decode(decompressedBuf);
    }
    return new TextDecoder('utf-8').decode(bytes);
  }

  function sanitizeXmlText(text){
    return text
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '')
      .replace(/&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9a-fA-F]+;)/g, '&amp;');
  }

  async function loadEpg(url){
    if(!url){ setEpgStatus('Укажите ссылку на EPG (XMLTV).', true); return; }
    setEpgStatus('Загрузка телепрограммы… файл может быть большим (десятки МБ), это может занять время.');
    els.epgLoadBtn.disabled = true;

    let res;
    try{
      res = await fetch(url, { cache: 'no-store' });
    }catch(err){
      epgData = null;
      setEpgStatus('Не удалось подключиться к серверу EPG: ' + err.message + '. Возможно, сервер блокирует запросы из браузера (CORS).', true);
      els.epgLoadBtn.disabled = false;
      return;
    }
    if(!res.ok){
      epgData = null;
      setEpgStatus('Сервер EPG ответил с ошибкой: HTTP ' + res.status + '.', true);
      els.epgLoadBtn.disabled = false;
      return;
    }

    try{
      let lastPct = -1;
      let text = await readEpgResponseText(res, (received, total) => {
        if(total > 0){
          const pct = Math.min(100, Math.round(received / total * 100));
          if(pct !== lastPct){
            lastPct = pct;
            setEpgStatus('Загрузка телепрограммы… ' + pct + '% (' + (received / 1048576).toFixed(1) + ' из ' + (total / 1048576).toFixed(1) + ' МБ)');
          }
        } else {
          setEpgStatus('Загрузка телепрограммы… ' + (received / 1048576).toFixed(1) + ' МБ');
        }
      });
      setEpgStatus('Распаковка и разбор телепрограммы…');
      text = sanitizeXmlText(text);
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      const parserErrorEl = xml.querySelector('parsererror');
      if(parserErrorEl){
        const detail = parserErrorEl.textContent.replace(/\s+/g, ' ').trim().slice(0, 400);
        throw new Error('получено ' + text.length + ' символов. ' + detail);
      }

      const programsByChannelId = new Map();
      xml.querySelectorAll('programme').forEach(p => {
        const chId = p.getAttribute('channel');
        const start = parseXmltvTime(p.getAttribute('start'));
        const stop = parseXmltvTime(p.getAttribute('stop'));
        if(!chId || !start || !stop) return;
        const titleEl = p.querySelector('title');
        const title = titleEl ? titleEl.textContent.trim() : 'Без названия';
        if(!programsByChannelId.has(chId)) programsByChannelId.set(chId, []);
        programsByChannelId.get(chId).push({ start, stop, title });
      });
      programsByChannelId.forEach(list => list.sort((a, b) => a.start - b.start));

      const idByNormalizedName = new Map();
      xml.querySelectorAll('channel').forEach(c => {
        const id = c.getAttribute('id');
        if(!id) return;
        c.querySelectorAll('display-name').forEach(dn => {
          const norm = normalizeName(dn.textContent || '');
          if(norm && !idByNormalizedName.has(norm)) idByNormalizedName.set(norm, id);
        });
      });

      if(programsByChannelId.size === 0) throw new Error('в файле не нашлось ни одной передачи (<programme>)');

      epgData = { idByNormalizedName, programsByChannelId };
      buildEpgMatches();
      renderEpgPanels();
    }catch(err){
      console.error(err);
      epgData = null;
      setEpgStatus('Не удалось разобрать телепрограмму: ' + err.message + '.', true);
    }finally{
      els.epgLoadBtn.disabled = false;
    }
  }

  function showToast(msg, isError){
    els.toast.textContent = msg;
    els.toast.classList.toggle('error', !!isError);
    els.toast.classList.remove('hidden');
    clearTimeout(toastHandle);
    toastHandle = setTimeout(() => els.toast.classList.add('hidden'), 4500);
  }

  function pickRecordMime(hasVideo){
    if(!window.MediaRecorder) return '';
    const candidates = hasVideo
      ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
      : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    for(const type of candidates){
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) return type;
    }
    return '';
  }

  function extFromMime(mime){
    return mime && mime.includes('mp4') ? 'mp4' : 'webm';
  }

  function updateRecordUI(active){
    els.recordBtn.classList.toggle('active', active);
    els.recordLabel.textContent = active ? 'Стоп' : 'Запись';
    els.recordTimer.classList.toggle('hidden', !active);
    if(!active) els.recordTimer.textContent = '00:00';
  }

  function tickRecordTimer(){
    const sec = Math.floor((Date.now() - recordStartTime) / 1000);
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    els.recordTimer.textContent = m + ':' + s;
  }

  function startRecording(){
    if(currentIndex < 0){ showToast('Сначала выберите канал.', true); return; }
    if(!window.MediaRecorder){ showToast('Браузер не поддерживает запись (MediaRecorder).', true); return; }

    const isAudio = !els.audioFace.classList.contains('hidden');
    const el = isAudio ? els.audioEl : els.video;
    const captureFn = el.captureStream || el.mozCaptureStream;
    if(!captureFn){ showToast('Браузер не поддерживает захват потока с этого плеера.', true); return; }

    let stream;
    try{
      stream = captureFn.call(el);
    }catch(err){
      showToast('Не удалось захватить поток: ' + err.message, true);
      return;
    }
    if(!stream || stream.getTracks().length === 0){
      showToast('Поток пуст — источник может блокировать захват (CORS).', true);
      return;
    }

    const mimeType = pickRecordMime(!isAudio);
    recordedChunks = [];
    try{
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    }catch(err){
      showToast('Не удалось начать запись: ' + err.message, true);
      return;
    }

    mediaRecorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onerror = (e) => {
      showToast('Ошибка записи: ' + (e.error ? e.error.message : 'неизвестная ошибка'), true);
      stopRecording();
    };
    mediaRecorder.onstop = finalizeRecording;

    mediaRecorder.start();
    recordStartTime = Date.now();
    updateRecordUI(true);
    recordTimerHandle = setInterval(tickRecordTimer, 1000);
  }

  function stopRecording(){
    if(mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
    clearInterval(recordTimerHandle);
    updateRecordUI(false);
  }

  function finalizeRecording(){
    if(recordedChunks.length === 0){
      showToast('Запись пустая — возможно, источник защищён от захвата (CORS).', true);
      return;
    }
    const mimeType = mediaRecorder.mimeType || 'video/webm';
    const blob = new Blob(recordedChunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const ch = channels[currentIndex];
    const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const safeName = (ch ? ch.name : 'эфир').replace(/[^\p{L}\p{N}_-]+/gu, '_');
    const a = document.createElement('a');
    a.href = url;
    a.download = safeName + '_' + ts + '.' + extFromMime(mimeType);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    showToast('Запись сохранена в файл.');
    recordedChunks = [];
  }

  function parseM3U(text){
    const lines = text.split(/\r?\n/);
    const result = [];
    let pending = null;
    for(let raw of lines){
      const line = raw.trim();
      if(!line) continue;
      if(line.startsWith('#EXTINF')){
        const groupMatch = line.match(/group-title="([^"]*)"/);
        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
        const idMatch = line.match(/tvg-id="([^"]*)"/);
        const nameMatch = line.match(/,(.*)$/);
        pending = {
          group: groupMatch ? (groupMatch[1].trim() || 'Без категории') : 'Без категории',
          logo: logoMatch ? logoMatch[1] : null,
          tvgId: idMatch ? idMatch[1] : null,
          name: nameMatch ? nameMatch[1].trim() : 'Канал',
        };
      } else if(line.startsWith('#')){
        continue;
      } else if(pending){
        pending.url = line;
        result.push(pending);
        pending = null;
      }
    }
    return result;
  }

  function setStatus(text, isError){
    els.status.textContent = text;
    els.status.classList.toggle('error', !!isError);
  }

  async function fetchPlaylist(url){
    if(!url){ setStatus('Укажите ссылку на плейлист.', true); return; }
    setStatus('Загрузка плейлиста…');
    els.groups.innerHTML = '';
    try{
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const epgMatch = text.match(/url-tvg="([^"]*)"/i) || text.match(/x-tvg-url="([^"]*)"/i);
      if(epgMatch && !els.epgUrlInput.value){
        els.epgUrlInput.value = epgMatch[1];
      }
      const parsed = parseM3U(text);
      if(parsed.length === 0) throw new Error('в файле не найдено ни одного канала (#EXTINF)');
      channels = parsed;
      renderGroups(channels);
      setStatus(channels.length + ' каналов загружено');
    }catch(err){
      console.error(err);
      setStatus('Не удалось загрузить плейлист: ' + err.message, true);
    }
  }

  function renderGroups(list){
    const byGroup = new Map();
    list.forEach((ch, i) => {
      ch.number = String(i + 1).padStart(3, '0');
      if(!byGroup.has(ch.group)) byGroup.set(ch.group, []);
      byGroup.get(ch.group).push(i);
    });

    els.groups.innerHTML = '';
    let first = true;
    for(const [group, indices] of byGroup){
      const details = document.createElement('details');
      details.open = first; first = false;

      const summary = document.createElement('summary');
      summary.innerHTML = '<span>' + escapeHtml(group) + '</span><span class="group-count">' + indices.length + '</span>';
      details.appendChild(summary);

      const ul = document.createElement('ul');
      ul.className = 'channel-list';

      indices.forEach(idx => {
        const ch = list[idx];
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'channel-btn';
        btn.dataset.index = idx;
        const radioTag = isAudioUrl(ch.url) ? '<span class="ch-tag">FM</span>' : '';
        btn.innerHTML = logoHtml(ch) + '<span class="ch-num">' + ch.number + '</span><span class="ch-name">' + escapeHtml(ch.name) + '</span>' + radioTag;
        btn.addEventListener('click', () => playChannel(idx));
        li.appendChild(btn);
        ul.appendChild(li);
      });

      details.appendChild(ul);
      els.groups.appendChild(details);
    }

    renderCategoryList(byGroup);
    mobileCategoryFilter = null;
    els.mobileFilterChip.classList.add('hidden');
    setMobileTab('channels');
    updateMobileChannelList();
    buildEpgMatches();
    renderEpgPanels();
  }

  function renderCategoryList(byGroup){
    els.mobileCategoryList.innerHTML = '';
    for(const [group, indices] of byGroup){
      const btn = document.createElement('button');
      btn.className = 'mobile-category-row';
      btn.dataset.group = group;
      btn.innerHTML =
        '<span class="cat-icon"><span></span><span></span><span></span><span></span></span>' +
        '<span class="cat-name">' + escapeHtml(group) + '</span>' +
        '<span class="cat-count">' + indices.length + '</span>';
      els.mobileCategoryList.appendChild(btn);
    }
  }

  function renderMobileChannelList(indices){
    if(indices.length === 0){
      els.mobileChannelList.innerHTML = '<div class="rail-status">Каналы не найдены</div>';
      return;
    }
    els.mobileChannelList.innerHTML = indices.map(i => {
      const ch = channels[i];
      const radioTag = isAudioUrl(ch.url) ? '<span class="ch-tag">FM</span>' : '';
      return '<button class="mobile-row" data-index="' + i + '">' +
        logoHtml(ch) +
        '<span class="ch-row-name">' + escapeHtml(ch.name) + '</span>' +
        radioTag +
        '</button>';
    }).join('');
  }

  function updateMobileChannelList(){
    const q = els.searchInput.value.trim().toLowerCase();
    const indices = [];
    channels.forEach((ch, i) => {
      if(mobileCategoryFilter && ch.group !== mobileCategoryFilter) return;
      const matches = !q || ch.name.toLowerCase().includes(q) || (ch.number && ch.number.includes(q));
      if(!matches) return;
      indices.push(i);
    });
    renderMobileChannelList(indices);
  }

  function setMobileTab(tab){
    els.tabChannelsBtn.classList.toggle('active', tab === 'channels');
    els.tabCategoriesBtn.classList.toggle('active', tab === 'categories');
    els.tabProgramBtn.classList.toggle('active', tab === 'program');
    els.mobileChannelList.classList.toggle('hidden', tab !== 'channels');
    els.mobileCategoryList.classList.toggle('hidden', tab !== 'categories');
    els.epgPanelMobile.classList.toggle('hidden', tab !== 'program');
  }

  function selectCategory(group){
    mobileCategoryFilter = group;
    els.mobileFilterLabel.textContent = group;
    els.mobileFilterChip.classList.remove('hidden');
    updateMobileChannelList();
    setMobileTab('channels');
  }

  function highlightActive(index){
    document.querySelectorAll('[data-index].active').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('[data-index="' + index + '"]').forEach(b => {
      b.classList.add('active');
      b.scrollIntoView({ block: 'nearest' });
    });
  }

  function showOSD(ch){
    clearTimeout(osdTimer);
    els.osdNum.textContent = ch.number;
    els.osdName.textContent = ch.name;
    els.osdGroup.textContent = ch.group;
    els.osd.classList.remove('hidden');
    els.osd.style.animation = 'none';
    requestAnimationFrame(() => { els.osd.style.animation = ''; });
    osdTimer = setTimeout(() => els.osd.classList.add('hidden'), 3200);
  }

  function describeHlsError(data){
    if(data && data.type === 'networkError'){
      return 'Сервер потока не отвечает или блокирует браузерные запросы (CORS). Такие каналы часто работают в VLC/IPTV-плеере, но не в браузере.';
    }
    if(data && data.type === 'mediaError'){
      return 'Поток повреждён или формат не поддерживается браузером.';
    }
    return 'Не удалось воспроизвести этот канал.';
  }

  function showError(message){
    els.loading.classList.add('hidden');
    els.errorDetail.textContent = message;
    els.errorBox.classList.remove('hidden');
  }

  function stopAll(){
    if(hls){ hls.destroy(); hls = null; }
    els.video.removeAttribute('src');
    els.video.load();
    els.audioEl.pause();
    els.audioEl.removeAttribute('src');
  }

  function playChannel(index){
    const ch = channels[index];
    if(!ch) return;
    if(mediaRecorder && mediaRecorder.state === 'recording'){
      stopRecording();
    }
    currentIndex = index;
    highlightActive(index);
    showOSD(ch);
    setRailOpen(false);
    renderEpgPanels();
    els.placeholder.classList.add('hidden');
    els.errorBox.classList.add('hidden');
    stopAll();

    if(isAudioUrl(ch.url)){
      els.video.classList.add('hidden');
      els.audioFace.classList.remove('hidden');
      els.audioEl.classList.remove('hidden');
      els.audioEl.src = ch.url;
      els.audioEl.play().catch(err => showError('Радиопоток не воспроизводится: ' + err.message));
    } else {
      els.audioFace.classList.add('hidden');
      els.audioEl.classList.add('hidden');
      els.video.classList.remove('hidden');
      playVideo(ch.url);
    }
  }

  function playVideo(url){
    els.loading.classList.remove('hidden');
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(els.video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        els.loading.classList.add('hidden');
        els.video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (_evt, data) => {
        if(data.fatal){
          showError(describeHlsError(data));
        }
      });
    } else if(els.video.canPlayType('application/vnd.apple.mpegurl')){
      els.video.src = url;
      els.video.addEventListener('loadedmetadata', () => els.loading.classList.add('hidden'), { once: true });
      els.video.play().catch(err => showError('Не удалось запустить поток: ' + err.message));
    } else {
      showError('Браузер не поддерживает воспроизведение HLS-потоков.');
    }
  }

  els.video.addEventListener('error', () => {
    if(!hls) showError('Не удалось воспроизвести этот канал.');
  });

  els.retryBtn.addEventListener('click', () => { if(currentIndex >= 0) playChannel(currentIndex); });
  els.nextBtn.addEventListener('click', () => { if(currentIndex + 1 < channels.length) playChannel(currentIndex + 1); });

  els.playlistSelect.addEventListener('change', () => {
    els.customUrl.classList.toggle('hidden', els.playlistSelect.value !== 'custom');
  });

  els.loadBtn.addEventListener('click', () => {
    const val = els.playlistSelect.value;
    const url = val === 'custom' ? els.customUrl.value.trim() : PLAYLISTS[val];
    fetchPlaylist(url);
  });

  els.searchInput.addEventListener('input', () => {
    const q = els.searchInput.value.trim().toLowerCase();
    document.querySelectorAll('#groups details').forEach(details => {
      let anyVisible = false;
      details.querySelectorAll('.channel-list > li').forEach(li => {
        const name = li.querySelector('.ch-name').textContent.toLowerCase();
        const numEl = li.querySelector('.ch-num');
        const num = numEl ? numEl.textContent.trim() : '';
        const match = name.includes(q) || num.includes(q);
        li.style.display = match ? '' : 'none';
        if(match) anyVisible = true;
      });
      details.style.display = anyVisible ? '' : 'none';
      if(q) details.open = anyVisible;
    });
    updateMobileChannelList();
  });

  els.tabChannelsBtn.addEventListener('click', () => setMobileTab('channels'));
  els.tabCategoriesBtn.addEventListener('click', () => setMobileTab('categories'));
  els.tabProgramBtn.addEventListener('click', () => setMobileTab('program'));

  els.epgLoadBtn.addEventListener('click', () => loadEpg(els.epgUrlInput.value.trim()));

  els.recordBtn.addEventListener('click', () => {
    if(mediaRecorder && mediaRecorder.state === 'recording'){
      stopRecording();
    } else {
      startRecording();
    }
  });

  els.mobileFilterClear.addEventListener('click', () => {
    mobileCategoryFilter = null;
    els.mobileFilterChip.classList.add('hidden');
    updateMobileChannelList();
  });

  els.mobileChannelList.addEventListener('click', (e) => {
    const btn = e.target.closest('.mobile-row');
    if(btn) playChannel(Number(btn.dataset.index));
  });

  els.mobileCategoryList.addEventListener('click', (e) => {
    const btn = e.target.closest('.mobile-category-row');
    if(btn) selectCategory(btn.dataset.group);
  });

  function setRailOpen(open){
    els.rail.classList.toggle('open', open);
    els.railToggle.setAttribute('aria-expanded', String(open));
    els.railToggle.textContent = open ? '✕ Закрыть' : '☰ Список каналов';
    els.railBackdrop.classList.toggle('hidden', !open);
  }

  els.railToggle.addEventListener('click', () => {
    setRailOpen(!els.rail.classList.contains('open'));
  });

  els.railBackdrop.addEventListener('click', () => setRailOpen(false));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') setRailOpen(false);
  });

  fetchPlaylist(PLAYLISTS.main);
  loadEpg(els.epgUrlInput.value.trim());
</script>
</body>
</html>
