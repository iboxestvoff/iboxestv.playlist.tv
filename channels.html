<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТВ 34 — Онлайн Телевидение</title>
    <style>
        /* Стили вашего приложения */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .auth-btn {
            background-color: #fc3f1d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .auth-btn:hover {
            background-color: #e32b0f;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Авторизация через Yandex</h2>
    <button class="auth-btn" id="yandex-login-btn">Войти через Яндекс</button>
</div>

<script>
    // Конфигурация Яндекс OAuth с вашими новыми данными
    const YANDEX_CONFIG = {
        clientId: '0fc0a6b7929b4efdb1822f75b1c078b8',
        clientSecret: '3a5e85799ec44984bb67bc01f1d40f08',
        redirectUri: 'https://televizor34.onrender.com',
        authUrl: 'https://oauth.yandex.ru/authorize'
    };

    // Функция для инициализации входа
    function loginWithYandex() {
        const url = `${YANDEX_CONFIG.authUrl}?response_type=code&client_id=${YANDEX_CONFIG.clientId}&redirect_uri=${encodeURIComponent(YANDEX_CONFIG.redirectUri)}`;
        window.location.href = url;
    }

    // Обработчик клика на кнопку
    document.getElementById('yandex-login-btn').addEventListener('click', loginWithYandex);

    // Логика обработки callback (проверка параметров в URL после редиректа)
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            console.log('Получен код авторизации от Яндекс:', code);
            // Здесь ваша логика обмена кода на токен (через сервер или напрямую, если применимо)
            // И не забывайте очистить URL от параметров:
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });
</script>

</body>
</html>
