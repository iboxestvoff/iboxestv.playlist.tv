<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Web Cookies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input { width: 100%; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #0056b3; }
        .delete-btn { background-color: #dc3545; }
        .delete-btn:hover { background-color: #bd2130; }
        pre {
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <h2>Панель управления Cookies</h2>

    <div class="card">
        <h3>1. Записать Cookie</h3>
        <label for="cookieName">Имя (Ключ):</label>
        <input type="text" id="cookieName" placeholder="например, username">
        
        <label for="cookieValue">Значение:</label>
        <input type="text" id="cookieValue" placeholder="например, Илон Маск">
        
        <label for="cookieDays">Срок действия (в днях):</label>
        <input type="number" id="cookieDays" value="7">
        
        <button onclick="saveCookie()">Сохранить Cookie</button>
    </div>

    <div class="card">
        <h3>2. Текущие сохраненные Cookies</h3>
        <button onclick="showCookies()">Обновить список</button>
        <pre id="cookieDisplay">Нажмите "Обновить список", чтобы загрузить куки...</pre>
    </div>

    <div class="card">
        <h3>3. Удалить Cookie</h3>
        <input type="text" id="deleteName" placeholder="Имя куки для удаления">
        <button class="delete-btn" onclick="deleteCookieBtn()">Удалить</button>
    </div>

    <script>
        // Функция сохранения куки
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                // Переводим дни в миллисекунды
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            // Записываем куки с флагом SameSite для безопасности
            document.cookie = encodeURIComponent(name) + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Lax";
        }

        // Функция чтения всех куки
        function getCookies() {
            return document.cookie;
        }

        // Функция удаления конкретной куки (ставим дату истечения в прошлое)
        function eraseCookie(name) {
            document.cookie = encodeURIComponent(name) + '=; Max-Age=-99999999; path=/; SameSite=Lax';
        }

        // --- Обработчики интерфейса ---

        function saveCookie() {
            const name = document.getElementById('cookieName').value.trim();
            const value = document.getElementById('cookieValue').value.trim();
            const days = parseInt(document.getElementById('cookieDays').value);

            if (!name || !value) {
                alert('Пожалуйста, заполните имя и значение!');
                return;
            }

            setCookie(name, value, days);
            alert(`Cookie "${name}" успешно сохранена!`);
            showCookies();
        }

        function showCookies() {
            const cookies = getCookies();
            const display = document.getElementById('cookieDisplay');
            if (cookies) {
                // Красиво форматируем вывод, разделяя куки по точке с запятой
                display.textContent = cookies.split('; ').join('\n');
            } else {
                display.textContent = "Куки отсутствуют.";
            }
        }

        function deleteCookieBtn() {
            const name = document.getElementById('deleteName').value.trim();
            if (!name) {
                alert('Введите имя куки для удаления');
                return;
            }
            eraseCookie(name);
            alert(`Запрос на удаление "${name}" отправлен.`);
            showCookies();
        }

        // Показываем куки сразу при загрузке страницы
        window.onload = showCookies;
    </script>
</body>
</html>
