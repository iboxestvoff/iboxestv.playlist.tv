<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Телевизор 34 — Категории и Телепрограмма</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121620;
    --panel-2: #1a1f2c;
    --line: #232938;
    --text: #eceef2;
    --muted: #7d8492;
    --accent: #ffb13d;
    --live: #ff5d5d;
  }

  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; overflow: hidden;
  }

  .focusable {
    border: 3px solid transparent;
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .focusable.tv-highlight {
    border-color: var(--accent) !important;
    transform: scale(1.02);
    background-color: var(--panel-2) !important;
  }

  .hidden { display: none !important; }

  /* Навигация (Табы) */
  .main-screen { display: flex; flex-direction: column; width: 100vw; height: 100vh; padding: 30px 50px; }
  .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
  .nav-left { display: flex; align-items: center; gap: 45px; }
  .logo-area { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; }
  .logo-area span { color: var(--accent); }
  
  .tabs-row { display: flex; gap: 15px; }
  .tab-btn {
    background: transparent; border: none; color: var(--muted);
    font-size: 18px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
  }
  .tab-btn.active { color: var(--text); background: var(--panel); border-bottom: 3px solid var(--accent); }
  .time-clock { font-weight: 600; min-width: 60px; text-align: right; font-family: 'Space Mono', monospace; font-size: 20px; }

  /* Общие стили списков */
  .content-view { flex: 1; display: flex; flex-direction: column; gap: 15px; min-height: 0; }
  .section-label { font-size: 20px; font-weight: 600; color: var(--muted); }
  .grid-container {
    display: flex; gap: 20px; overflow-x: auto; padding: 10px 0; scroll-behavior: smooth;
  }
  
  /* Карточки */
  .channel-card, .category-card {
    width: 220px; height: 135px; border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative; padding: 15px; flex-shrink: 0;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4); background: var(--panel);
  }
  .card-logo-box { width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; }
  .card-logo-box img { max-width: 80%; max-height: 100%; object-fit: contain; }
  .card-fallback { font-family: 'Space Mono', monospace; font-size: 22px; color: #fff; }
  .card-num { position: absolute; top: 10px; left: 15px; font-size: 12px; color: rgba(255,255,255,0.4); font-family: 'Space Mono', monospace;}

  /* Экран Телепрограммы (Мобильный вид расписания) */
  .epg-container { display: flex; gap: 30px; height: 100%; min-height: 0; }
  .epg-sidebar { width: 30%; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .epg-main-list { width: 70%; background: var(--panel); border-radius: 14px; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  
  .epg-row { display: flex; align-items: center; gap: 20px; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.02); }
  .epg-time { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent); min-width: 60px; }
  .epg-text { font-size: 16px; font-weight: 500; }

  /* ==========================================================================
     ЭКРАН ПРОСМОТРА (OSD)
     ========================================================================== */
  .player-screen { position: relative; width: 100vw; height: 100vh; background: #000; }
  .full-media-container { position: absolute; inset: 0; z-index: 1; }
  video, iframe { width: 100%; height: 100%; border: none; background: #000; }

  .osd-overlay {
    position: absolute; bottom: 0; left: 0; width: 100%;
    background: linear-gradient(0deg, rgba(10,13,20,0.95) 0%, rgba(10,13,20,0.85) 70%, rgba(10,13,20,0) 100%);
    padding: 60px 50px 40px 50px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 30px; transition: opacity 0.3s ease;
  }
  .osd-left { display: flex; align-items: center; gap: 20px; }
  .osd-channel-number { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; color: var(--accent); }
  .osd-logo-box { width: 100px; height: 65px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 5px; }
  .osd-logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .osd-logo-box span { font-size: 20px; font-weight: 700; color: #fff; }
  .osd-center { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .osd-program-title { font-size: 24px; font-weight: 600; color: #fff; }
  .osd-timeline-row { display: flex; align-items: center; gap: 15px; }
  .osd-time-stamp { font-family: 'Space Mono', monospace; font-size: 16px; color: var(--muted); }
  .osd-progress-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; }
  .osd-progress-bar { height: 100%; background: var(--accent); }
  .osd-right { display: flex; align-items: center; }
  .osd-clock { font-family: 'Space Mono', monospace; font-size: 38px; font-weight: 700; color: #fff; }

  .loading-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); font-size: 18px; color: var(--accent); font-family: 'Space Mono', monospace; z-index: 3; }
</style>
</head>
<body>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="view-main" class="main-screen">
    <header class="nav-bar">
      <div class="nav-left">
        <div class="logo-area">ТЕЛЕВИЗОР <span>34</span></div>
        <div class="tabs-row">
          <button class="tab-btn active focusable" data-tab="all" onclick="switchTab('all')">Все каналы</button>
          <button class="tab-btn focusable" data-tab="categories" onclick="switchTab('categories')">Категории</button>
          <button class="tab-btn focusable" data-tab="epg" onclick="switchTab('epg')">Телепрограмма</button>
        </div>
      </div>
      <div class="nav-right">
        <div class="time-clock" id="clock">00:00</div>
      </div>
    </header>

    <!-- ВКЛАДКА 1: ВСЕ КАНАЛЫ -->
    <div id="tab-content-all" class="content-view">
      <div id="sectionTitle" class="section-label">Загрузка каналов...</div>
      <div class="grid-container" id="main-carousel"></div>
    </div>

    <!-- ВКЛАДКА 2: КАТЕГОРИИ -->
    <div id="tab-content-categories" class="content-view hidden">
      <div class="section-label">Жанры из плейлиста</div>
      <div class="grid-container" id="categories-carousel"></div>
    </div>

    <!-- ВКЛАДКА 3: ТЕЛЕПРОГРАММА (Мобильное расписание) -->
    <div id="tab-content-epg" class="content-view hidden">
      <div class="epg-container">
        <!-- Левая часть: Выбор канала -->
        <div class="epg-sidebar" id="epg-channels-list"></div>
        <!-- Правая часть: Мобильная лента передач -->
        <div class="epg-main-list" id="epg-schedule-list">
          <div style="color:var(--muted); text-align:center; margin-top:40px;">Выберите канал слева, чтобы открыть телепрограмму</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ЭКРАН ПРОСМОТРА (OSD) -->
  <div id="view-player" class="player-screen hidden">
    <div class="full-media-container">
      <video id="tv-video" playsinline></video>
      <iframe id="embedFrame" class="hidden" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div id="video-loading" class="loading-overlay hidden">Подключение к трансляции...</div>

    <div id="osdMenu" class="osd-overlay">
      <div class="osd-left">
        <div class="osd-channel-number" id="osdNum">001</div>
        <div class="osd-logo-box" id="osdLogo"></div>
      </div>
      <div class="osd-center">
        <div class="osd-program-title" id="osdTitle">Название канала</div>
        <div class="osd-timeline-row">
          <span class="osd-time-stamp" id="osdTimeStart">19:51</span>
          <div class="osd-progress-bg">
            <div class="osd-progress-bar" style="width: 45%;"></div>
          </div>
          <span class="osd-time-stamp" id="osdTimeEnd">19:53</span>
        </div>
      </div>
      <div class="osd-right">
        <div class="osd-clock" id="osdClock">00:00</div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
  const PLAYLIST_URL = 'https://raw.githubusercontent.com/iboxestvoff/iboxestv.playlist.tv/main/playlist.m3u';
  
  let allChannels = [];
  let categories = {};
  let currentTab = 'all';
  let hlsInstance = null;
  let currentScreen = 'main';
  let focusedIndex = 0;
  let osdTimeout = null;

  // Имитация базы данных телепрограммы (EPG)
  const MOCK_EPG = [
    { time: "08:00", title: "Утреннее вещание и новости" },
    { time: "10:15", title: "Мультсериал: Новые приключения" },
    { time: "12:00", title: "Информационный выпуск" },
    { time: "13:30", title: "Документальный фильм" },
    { time: "16:00", title: "Комедийный сериал" },
    { time: "18:45", title: "Премьера: Художественный фильм" },
    { time: "21:00", title: "Вечернее шоу в прямом эфире" },
    { time: "23:30", title: "Ночной киносеанс" }
  ];

  function getEmbedInfo(url) {
    if (/(^|\.)vk(video)?\.(com|ru)\/(video_ext\.php|video-)/i.test(url)) return { embedUrl: url };
    const rutubeId = url.match(/rutube\.ru\/(?:play\/embed\/|video\/)([a-z0-9]+)/i);
    if (rutubeId) return { embedUrl: 'https://rutube.ru/play/embed/' + rutubeId[1] + '/' };
    return null;
  }

  function parseM3U(text) {
    const lines = text.split(/\r?\n/);
    const result = [];
    let pending = null;
    
    for (let raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith('#EXTINF')) {
        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
        const nameMatch = line.match(/,(.*)$/);
        const groupMatch = line.match(/group-title="([^"]*)"/);
        
        pending = {
          logo: logoMatch ? logoMatch[1] : null,
          name: nameMatch ? nameMatch[1].trim() : 'Канал',
          group: groupMatch ? groupMatch[1].trim() : 'Другие'
        };
      } else if (!line.startsWith('#') && pending) {
        pending.url = line;
        result.push(pending);
        
        // Сортировка по категориям
        if (!categories[pending.group]) categories[pending.group] = [];
        categories[pending.group].push(pending);
        
        pending = null;
      }
    }
    return result;
  }

  async function loadPlaylist() {
    try {
      const res = await fetch(PLAYLIST_URL, { cache: 'no-store' });
      const text = await res.text();
      allChannels = parseM3U(text);
      renderAllChannels();
      renderCategories();
      renderEpgSidebar();
    } catch (e) {
      document.getElementById('sectionTitle').innerText = "Ошибка загрузки плейлиста";
    }
  }

  // 1. Рендеринг всех каналов
  function renderAllChannels() {
    const container = document.getElementById('main-carousel');
    document.getElementById('sectionTitle').innerText = `Телеканалы (${allChannels.length})`;
    container.innerHTML = allChannels.map((ch, idx) => `
      <div class="focusable channel-card" data-idx="${idx}" onclick="openPlayerView(${idx})">
        <div class="card-num">${String(idx + 1).padStart(3, '0')}</div>
        <div class="card-logo-box">
          ${ch.logo ? `<img src="${ch.logo}">` : `<div class="card-fallback">${ch.name.substring(0,3)}</div>`}
        </div>
        <div style="font-size:13px; margin-top:8px; font-weight:500; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; width:100%;">${ch.name}</div>
      </div>
    `).join('');
  }

  // 2. Рендеринг категорий
  function renderCategories() {
    const container = document.getElementById('categories-carousel');
    container.innerHTML = Object.keys(categories).map((catName, idx) => `
      <div class="focusable category-card" onclick="selectCategory('${catName}')">
        <div class="card-fallback" style="font-size:18px; color:var(--accent); text-align:center;">${catName}</div>
        <div style="font-size:12px; color:var(--muted); margin-top:5px;">Каналов: ${categories[catName].length}</div>
      </div>
    `).join('');
  }

  function selectCategory(catName) {
    allChannels = categories[catName];
    renderAllChannels();
    switchTab('all');
  }

  // 3. Рендеринг бокового меню телепрограммы
  function renderEpgSidebar() {
    const sidebar = document.getElementById('epg-channels-list');
    sidebar.innerHTML = allChannels.map((ch, idx) => `
      <div class="focusable" style="background:var(--panel); padding:12px; border-radius:8px; display:flex; align-items:center; gap:10px;" onclick="showMobileEpg(${idx})">
        <div style="font-family: 'Space Mono', monospace; color:var(--accent);">${String(idx+1).padStart(3,'0')}</div>
        <div style="font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ch.name}</div>
      </div>
    `).join('');
  }

  // Показ подробной мобильной версии EPG по клику на канал
  function showMobileEpg(idx) {
    const ch = allChannels[idx];
    const container = document.getElementById('epg-schedule-list');
    
    container.innerHTML = `
      <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px; border-bottom:1px solid var(--line); padding-bottom:15px;">
        <div style="font-size:20px; font-weight:700; color:var(--accent);">${ch.name}</div>
        <button class="focusable" style="background:var(--accent); border:none; color:#000; padding:6px 12px; font-weight:700; border-radius:6px;" onclick="openPlayerView(${idx})">Смотреть эфир</button>
      </div>
      ${MOCK_EPG.map(item => `
        <div class="epg-row">
          <div class="epg-time">${item.time}</div>
          <div class="epg-text">${item.title}</div>
        </div>
      `).join('')}
    `;
  }

  // Переключение вкладок
  function switchTab(tabId) {
    currentTab = tabId;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
    
    document.getElementById('tab-content-all').classList.add('hidden');
    document.getElementById('tab-content-categories').classList.add('hidden');
    document.getElementById('tab-content-epg').classList.add('hidden');
    
    document.getElementById(`tab-content-${tabId}`).classList.remove('hidden');
  }

  /* ==========================================================================
     ЛОГИКА УПРАВЛЕНИЯ ПЛЕЕРОМ
     ========================================================================== */
  function openPlayerView(idx) {
    currentScreen = 'player';
    focusedIndex = idx;
    document.getElementById('view-main').classList.add('hidden');
    document.getElementById('view-player').classList.remove('hidden');
    startChannel(idx);
  }

  function closePlayerView() {
    currentScreen = 'main';
    if(hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    const video = document.getElementById('tv-video');
    video.pause(); video.removeAttribute('src'); video.load();
    document.getElementById('embedFrame').src = 'about:blank';
    document.getElementById('view-player').classList.add('hidden');
    document.getElementById('view-main').classList.remove('hidden');
  }

  function startChannel(idx) {
    const ch = allChannels[idx];
    if(!ch) return;

    document.getElementById('osdNum').innerText = String(idx + 1).padStart(3, '0');
    document.getElementById('osdTitle').innerText = ch.name;
    document.getElementById('osdLogo').innerHTML = ch.logo ? `<img src="${ch.logo}" alt="">` : `<span>${ch.name.substring(0,2)}</span>`;

    showOSD();

    const video = document.getElementById('tv-video');
    const embed = document.getElementById('embedFrame');
    const loader = document.getElementById('video-loading');
    
    loader.classList.remove('hidden');
    video.classList.add('hidden');
    embed.classList.add('hidden');

    const embedInfo = getEmbedInfo(ch.url);
    if (embedInfo) {
      loader.classList.add('hidden');
      embed.classList.remove('hidden');
      embed.src = embedInfo.embedUrl;
      return;
    }

    video.classList.remove('hidden');
    if (Hls.isSupported()) {
      if(hlsInstance) hlsInstance.destroy();
      hlsInstance = new Hls();
      hlsInstance.loadSource(ch.url);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { loader.classList.add('hidden'); video.play().catch(()=>{}); });
    } else {
      video.src = ch.url;
      video.addEventListener('loadedmetadata', () => { loader.classList.add('hidden'); video.play().catch(()=>{}); }, { once: true });
    }
  }

  function showOSD() {
    const osd = document.getElementById('osdMenu');
    osd.style.opacity = '1';
    clearTimeout(osdTimeout);
    osdTimeout = setTimeout(() => osd.style.opacity = '0', 5000);
  }

  // Обработка кнопок назад (Esc) для выхода из плеера
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === 'Backspace') {
      e.preventDefault();
      if (currentScreen === 'player') closePlayerView();
    }
    if (currentScreen === 'player') {
      showOSD();
      if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
        if (focusedIndex < allChannels.length - 1) { focusedIndex++; startChannel(focusedIndex); }
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
        if (focusedIndex > 0) { focusedIndex--; startChannel(focusedIndex); }
      }
    }
  });

  // Обновление системного времени
  setInterval(() => {
    const d = new Date();
    const tStr = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    document.getElementById('clock').innerText = tStr;
    document.getElementById('osdClock').innerText = tStr;
  }, 1000);

  loadPlaylist();
</script>
</body>
</html>
