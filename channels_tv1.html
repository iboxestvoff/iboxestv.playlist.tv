<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Телевизор 34</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121620;
    --panel-2: #1a1f2c;
    --line: #232938;
    --text: #eceef2;
    --muted: #7d8492;
    --accent: #ffb13d;
    --live: #ff5d5d;
    --fav: #ffc107;
  }

  * { box-sizing: border-box; }
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; overflow: hidden;
  }

  /* Стили фокуса для пульта */
  .focusable {
    border: 3px solid transparent;
    transition: all 0.15s ease;
    cursor: pointer;
  }
  .focusable:focus, .focusable.tv-highlight {
    border-color: var(--accent) !important;
    transform: scale(1.04);
    background-color: var(--panel-2) !important;
    outline: none;
  }

  .hidden { display: none !important; }

  /* Навигация (Табы и Поиск) */
  .main-screen { display: flex; flex-direction: column; width: 100vw; height: 100vh; padding: 30px 50px; }
  .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; gap: 20px; }
  .nav-left { display: flex; align-items: center; gap: 35px; flex: 1; }
  .logo-area { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 26px; flex-shrink: 0; }
  .logo-area span { color: var(--accent); }
  
  .tabs-row { display: flex; gap: 10px; }
  .tab-btn {
    background: transparent; border: none; color: var(--muted);
    font-size: 16px; font-weight: 600; padding: 8px 16px; border-radius: 8px;
  }
  .tab-btn.active { color: var(--text); background: var(--panel); border-bottom: 3px solid var(--accent); }
  
  /* Поисковая строка */
  .search-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 15px; color: var(--text); font-size: 14px; width: 200px;
    transition: all 0.2s; font-family: inherit;
  }
  .search-box:focus { border-color: var(--accent); width: 250px; outline: none; }

  .nav-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  .time-clock { font-weight: 600; font-family: 'Space Mono', monospace; font-size: 20px; }

  /* Общие стили списков */
  .content-view { flex: 1; display: flex; flex-direction: column; gap: 15px; min-height: 0; }
  .section-header-row { display: flex; align-items: center; justify-content: space-between; }
  .section-label { font-size: 20px; font-weight: 600; color: var(--muted); }
  .grid-container { display: flex; gap: 20px; overflow-x: auto; padding: 15px 5px; scroll-behavior: smooth; min-height: 180px; }
  
  /* Карточки */
  .channel-card, .category-card {
    width: 220px; height: 135px; border-radius: 14px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative; padding: 15px; flex-shrink: 0;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4); background: var(--panel);
  }
  .card-logo-box { width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; }
  .card-logo-box img { max-width: 80%; max-height: 100%; object-fit: contain; }
  .card-fallback { font-family: 'Space Mono', monospace; font-size: 22px; color: #fff; }
  .card-num { position: absolute; top: 10px; left: 15px; font-size: 12px; color: rgba(255,255,255,0.4); font-family: 'Space Mono', monospace;}
  
  /* Звёздочка Избранного */
  .fav-star {
    position: absolute; top: 8px; right: 12px; font-size: 18px; color: rgba(255,255,255,0.2);
    transition: color 0.2s; cursor: pointer; z-index: 5;
  }
  .fav-star.is-fav { color: var(--fav) !important; text-shadow: 0 0 8px rgba(261, 193, 7, 0.6); }

  /* Экран Телепрограммы */
  .epg-container { display: flex; gap: 30px; height: 100%; min-height: 0; }
  .epg-sidebar { width: 30%; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 5px; }
  .epg-ch-item { background: var(--panel); padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; border: 3px solid transparent; color: inherit; }
  .epg-main-list { width: 70%; background: var(--panel); border-radius: 14px; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  
  .epg-row { display: flex; align-items: center; gap: 20px; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.02); }
  .epg-row.current-live { border-left: 4px solid var(--accent); background: rgba(255, 177, 61, 0.05); }
  .epg-time { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--accent); min-width: 60px; }
  .epg-text { font-size: 16px; font-weight: 500; }

  /* Меню О нас */
  .about-box {
    display: flex; align-items: center; background: var(--panel); border-radius: 16px;
    padding: 35px; gap: 40px; max-width: 900px; margin: 40px auto 0 auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--line);
  }
  .about-qr-frame { 
    width: 180px; height: auto; background: #fff; padding: 10px; border-radius: 14px; 
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .about-qr-frame img { width: 100%; height: auto; display: block; }
  .about-text-side { display: flex; flex-direction: column; gap: 12px; }
  .about-title { font-size: 32px; font-weight: 700; color: var(--accent); margin: 0; }
  .about-desc { font-size: 18px; line-height: 1.6; color: var(--text); font-weight: 500; margin: 0; }

  /* Экран Просмотра (OSD) */
  .player-screen { position: relative; width: 100vw; height: 100vh; background: #000; }
  .full-media-container { position: absolute; inset: 0; z-index: 1; }
  video, iframe { width: 100%; height: 100%; border: none; background: #000; }

  .osd-overlay {
    position: absolute; bottom: 0; left: 0; width: 100%;
    background: linear-gradient(0deg, rgba(10,13,20,0.95) 0%, rgba(10,13,20,0.85) 70%, rgba(10,13,20,0) 100%);
    padding: 60px 50px 40px 50px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 30px; transition: opacity 0.3s ease;
  }
  .osd-left { display: flex; align-items: center; gap: 20px; }
  .osd-channel-number { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; color: var(--accent); }
  .osd-logo-box { width: 100px; height: 65px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 5px; }
