<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Телевизор 34 — ТВ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0e12;
    --panel:#161922;
    --panel-2:#1c2029;
    --line:#272c37;
    --text:#eceef2;
    --muted:#8990a0;
    --accent:#ffb13d;
    --accent-dim:#4a3a1c;
    --live:#ff5d5d;
    --focus:#5fb4ff;
    --focus-glow:rgba(95,180,255,.5);
  }
  *{box-sizing:border-box;}
  html{font-size:18px;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(ellipse 120% 100% at 50% 0%, #14171f 0%, var(--bg) 65%);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font-family:inherit;}
  .hidden{display:none !important;}

  .tv-app{
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100vw;
  }

  /* ---------- Header ---------- */
  .tv-header{
    display:flex;
    align-items:center;
    gap:clamp(16px,2vw,32px);
    padding:clamp(14px,1.6vh,22px) clamp(24px,3vw,44px);
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .tv-brand{
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:clamp(20px,2vw,28px);
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:10px;
    white-space:nowrap;
  }
  .brand-mark{color:var(--live); font-size:0.6em;}
  .accent{color:var(--accent);}
  .tv-badge{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--bg);
    background:var(--accent);
    padding:3px 8px;
    border-radius:5px;
    transform:translateY(1px);
  }
  .tv-header-spacer{flex:1;}
  .pl-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:9px 18px;
    font-size:15px;
    cursor:pointer;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .pl-icon{font-size:16px; color:var(--muted);}
  .tv-clock{
    font-family:'Space Mono',monospace;
    font-size:clamp(18px,1.8vw,24px);
    color:var(--muted);
    letter-spacing:1px;
    min-width:2.6em;
    text-align:right;
  }

  /* ---------- Focus ring (shared) ---------- */
  .focused{
    box-shadow:0 0 0 3px var(--focus), 0 0 22px 3px var(--focus-glow) !important;
    transform:scale(1.035);
    z-index:3;
  }

  /* ---------- Body grid ---------- */
  .tv-body{
    flex:1;
    display:grid;
    grid-template-columns:minmax(0,1.18fr) minmax(360px,1fr);
    min-height:0;
  }

  /* ---------- Player pane ---------- */
  .tv-player{
    position:relative;
    background:#000;
    border-right:1px solid var(--line);
    min-height:0;
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .screen::after{
    content:'';
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
    z-index:5;
  }
  .screen.switching::after{ opacity:.85; transition:opacity 0s; }

  video{width:100%; height:100%; background:#000; object-fit:contain;}
  #embedFrame{width:100%; height:100%; background:#000; border:none;}

  .audio-face{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    color:var(--muted);
  }
  .bars{display:flex; gap:7px; align-items:flex-end; height:56px;}
  .bars span{width:7px; background:var(--accent); border-radius:3px; animation:bounce 1s infinite ease-in-out;}
  .bars span:nth-child(1){height:20%; animation-delay:0s;}
  .bars span:nth-child(2){height:60%; animation-delay:0.1s;}
  .bars span:nth-child(3){height:100%; animation-delay:0.2s;}
  .bars span:nth-child(4){height:50%; animation-delay:0.3s;}
  .bars span:nth-child(5){height:80%; animation-delay:0.4s;}
  @keyframes bounce{0%,100%{transform:scaleY(0.3);} 50%{transform:scaleY(1);}}
  .audio-label{font-family:'Space Mono',monospace; letter-spacing:3px; font-size:14px;}

  .placeholder{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--muted); gap:10px; pointer-events:none;
  }
  .placeholder-num{font-family:'Space Mono',monospace; font-size:56px; color:var(--line);}
  .placeholder-text{font-size:16px;}

  .loading{
    position:absolute; bottom:24px; left:24px;
    font-family:'Space Mono',monospace; font-size:14px; color:var(--accent);
    background:rgba(0,0,0,0.6); padding:7px 14px; border-radius:8px; z-index:6;
  }

  .osd{
    position:absolute; top:24px; left:24px;
    background:rgba(8,9,12,0.82);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 18px;
    display:flex; align-items:baseline; gap:14px;
    animation:osdFade 3.2s forwards;
    pointer-events:none;
    z-index:6;
  }
  @keyframes osdFade{0%{opacity:1;} 78%{opacity:1;} 100%{opacity:0;}}
  .osd-num{font-family:'Space Mono',monospace; font-size:26px; font-weight:700; color:var(--accent);}
  .osd-name{font-size:19px; font-weight:600;}
  .osd-group{font-size:13px; color:var(--muted);}

  .error-box{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; background:rgba(0,0,0,0.88); text-align:center; padding:30px; z-index:7;
  }
  .error-title{color:var(--live); font-weight:700; font-size:19px; max-width:520px;}
  .error-detail{color:var(--muted); font-size:14px; max-width:460px;}
  .error-actions{display:flex; gap:14px;}
  .error-actions button{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:11px 22px; cursor:pointer; font-size:15px;
    transition:box-shadow .18s ease, transform .18s ease;
  }

  /* ---------- Player controls ---------- */
  .tv-controls{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:16px;
    padding:18px clamp(20px,3vw,36px);
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.65) 50%, rgba(0,0,0,0.88) 100%);
    z-index:4;
  }
  .cc-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width:54px; height:54px;
    border-radius:50%;
    flex-shrink:0;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .cc-btn svg{width:24px; height:24px; fill:currentColor;}
  .cc-live{
    display:flex; align-items:center; gap:8px;
    font-family:'Space Mono',monospace; font-size:14px; color:var(--live);
    letter-spacing:1.5px; flex-shrink:0;
  }
  .cc-live-dot{width:8px; height:8px; border-radius:50%; background:var(--live); animation:recPulse 1.4s infinite;}
  @keyframes recPulse{0%,100%{opacity:1;} 50%{opacity:.25;}}
  .cc-spacer{flex:1;}

  /* ---------- Side panel ---------- */
  .tv-side{
    display:flex;
    flex-direction:column;
    min-height:0;
    background:var(--panel);
  }
  .tv-status{
    padding:14px clamp(16px,2vw,26px) 0;
    color:var(--muted);
    font-size:14px;
    flex-shrink:0;
  }
  .tv-status.error{color:var(--live);}

  .tv-categories{
    display:flex;
    gap:10px;
    padding:14px clamp(16px,2vw,26px);
    overflow-x:auto;
    scrollbar-width:none;
    flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .tv-categories::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;
    display:flex; align-items:center; gap:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:999px;
    padding:9px 16px;
    font-size:14.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:box-shadow .18s ease, transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
  }
  .cat-chip.active{background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:700;}
  .cat-chip-count{font-family:'Space Mono',monospace; font-size:12px; opacity:.75;}

  .tv-channel-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:8px clamp(12px,1.6vw,20px) 24px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .rail-status{color:var(--muted); font-size:15px; padding:14px 8px;}

  .channel-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 14px;
    margin-bottom:6px;
    border-radius:12px;
    border:1px solid transparent;
    cursor:pointer;
    transition:box-shadow .18s ease, transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .channel-row.playing{background:var(--accent-dim); border-color:rgba(255,177,61,.35);}
  .channel-row.playing .row-name{color:var(--accent);}

  .ch-logo{
    width:50px; height:50px;
    border-radius:11px;
    flex-shrink:0;
    overflow:hidden;
    position:relative;
  }
  .ch-logo img{width:100%; height:100%; object-fit:cover; display:block;}
  .ch-logo-fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
  }

  .row-main{flex:1; min-width:0;}
  .row-name{
    font-size:17px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row-meta{
    display:flex; align-items:center; gap:8px;
    margin-top:3px;
    font-size:13px; color:var(--muted);
    overflow:hidden;
  }
  .row-group{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-tag{
    font-size:10.5px; border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; flex-shrink:0; color:var(--muted);
  }

  .row-right{
    display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;
  }
  .row-num{font-family:'Space Mono',monospace; font-size:13px; color:var(--muted);}
  .row-live{
    display:flex; align-items:center; gap:5px;
    font-family:'Space Mono',monospace; font-size:11px; color:var(--live); letter-spacing:.5px;
  }
  .row-live-dot{width:6px; height:6px; border-radius:50%; background:var(--live); animation:recPulse 1.4s infinite;}

  /* ---------- Numpad overlay ---------- */
  .numpad-overlay{
    position:absolute; top:24px; right:24px;
    background:rgba(8,9,12,0.9);
    border:1px solid var(--accent);
    color:var(--accent);
    font-family:'Space Mono',monospace;
    font-size:30px;
    font-weight:700;
    letter-spacing:4px;
    padding:10px 22px;
    border-radius:10px;
    z-index:8;
    min-width:90px;
    text-align:center;
  }

</style>
</head>
<body>
<div class="tv-app">
  <header class="tv-header">
    <div class="tv-brand"><span class="brand-mark">●</span> ТЕЛЕВИЗОР <span class="accent">34</span><span class="tv-badge">TV</span></div>
    <div class="tv-header-spacer"></div>
    <button id="playlistToggle" class="pl-toggle focusable" type="button" tabindex="-1">
      <span class="pl-icon">⇄</span><span class="pl-label">Основной плейлист</span>
    </button>
    <div id="clock" class="tv-clock">--:--</div>
  </header>

  <div class="tv-body">
    <main class="tv-player">
      <div id="screen" class="screen">
        <video id="video" class="hidden" playsinline crossorigin="anonymous"></video>
        <audio id="audioEl" class="hidden" crossorigin="anonymous"></audio>
        <iframe id="embedFrame" class="hidden" allow="autoplay; fullscreen; encrypted-media" allowfullscreen frameborder="0"></iframe>

        <div id="audioFace" class="audio-face hidden">
          <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="audio-label">РАДИО — ИДЁТ ЭФИР</div>
        </div>

        <div id="osd" class="osd hidden">
          <span id="osdNum" class="osd-num"></span>
          <span id="osdName" class="osd-name"></span>
          <span id="osdGroup" class="osd-group"></span>
        </div>

        <div id="placeholder" class="placeholder">
          <div class="placeholder-num">000</div>
          <div class="placeholder-text">Загрузка списка каналов…</div>
        </div>

        <div id="loading" class="loading hidden">Подключение…</div>

        <div id="errorBox" class="error-box hidden">
          <div class="error-title">Выбранный канал временно не работает, обратитесь в поддержку</div>
          <div class="error-detail" id="errorDetail"></div>
          <div class="error-actions">
            <button id="retryBtn" class="focusable" type="button" tabindex="-1">Повторить</button>
            <button id="nextBtn" class="focusable" type="button" tabindex="-1">Следующий канал</button>
          </div>
        </div>

        <div id="tvControls" class="tv-controls hidden">
          <button id="playPauseBtn" class="cc-btn focusable" type="button" tabindex="-1" aria-label="Воспроизвести/Пауза">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button id="muteBtn" class="cc-btn focusable" type="button" tabindex="-1" aria-label="Звук">
            <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="muteIcon" viewBox="0 0 24 24" class="hidden"><path d="M3.63 3.63L2.22 5.05 7.17 10H3v4h4l5 5v-6.17l4.18 4.18c-.65.49-1.38.88-2.18 1.11v2.06a8.99 8.99 0 0 0 3.62-1.85l1.95 1.95 1.41-1.41L3.63 3.63zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <span class="cc-live"><span class="cc-live-dot"></span>LIVE</span>
          <div class="cc-spacer"></div>
          <button id="fullscreenBtn" class="cc-btn focusable" type="button" tabindex="-1" aria-label="Полный экран">
            <svg id="fsEnterIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg id="fsExitIcon" viewBox="0 0 24 24" class="hidden"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>
        </div>

        <div id="numpad" class="numpad-overlay hidden">000</div>
      </div>
    </main>

    <aside class="tv-side">
      <div id="status" class="tv-status">Загрузка плейлиста…</div>
      <div id="categories" class="tv-categories"></div>
      <div id="channelList" class="tv-channel-list"></div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
  const PLAYLISTS = {
    main: 'https://raw.githubusercontent.com/iboxestvoff/iboxestv.playlist.tv/main/playlist.m3u',
    kids: 'https://raw.githubusercontent.com/iboxestvoff/iboxestv.playlist.tv/main/kids_playlist.m3u',
  };

  const els = {
    status: document.getElementById('status'),
    categories: document.getElementById('categories'),
    channelList: document.getElementById('channelList'),
    screen: document.getElementById('screen'),
    video: document.getElementById('video'),
    audioEl: document.getElementById('audioEl'),
    embedFrame: document.getElementById('embedFrame'),
    audioFace: document.getElementById('audioFace'),
    osd: document.getElementById('osd'),
    osdNum: document.getElementById('osdNum'),
    osdName: document.getElementById('osdName'),
    osdGroup: document.getElementById('osdGroup'),
    placeholder: document.getElementById('placeholder'),
    loading: document.getElementById('loading'),
    errorBox: document.getElementById('errorBox'),
    errorDetail: document.getElementById('errorDetail'),
    retryBtn: document.getElementById('retryBtn'),
    nextBtn: document.getElementById('nextBtn'),
    tvControls: document.getElementById('tvControls'),
    playPauseBtn: document.getElementById('playPauseBtn'),
    playIcon: document.getElementById('playIcon'),
    pauseIcon: document.getElementById('pauseIcon'),
    muteBtn: document.getElementById('muteBtn'),
    volumeIcon: document.getElementById('volumeIcon'),
    muteIcon: document.getElementById('muteIcon'),
    fullscreenBtn: document.getElementById('fullscreenBtn'),
    fsEnterIcon: document.getElementById('fsEnterIcon'),
    fsExitIcon: document.getElementById('fsExitIcon'),
    numpad: document.getElementById('numpad'),
    playlistToggle: document.getElementById('playlistToggle'),
    clock: document.getElementById('clock'),
  };

  let channels = [];
  let currentIndex = -1;
  let currentCategory = null;
  let currentPlaylistKey = 'main';
  let hls = null;
  let isEmbedActive = false;
  let osdTimer = null;
  let digitBuffer = '';
  let digitTimer = null;

  const zoneState = { zone:'channels', idx:{ header:0, controls:0, error:0, categories:0, channels:0 } };

  /* ---------------- helpers ---------------- */
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function isAudioUrl(url){ return /\.(mp3|aac)(\?|$)/i.test(url); }
  function nameColor(name){
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) | 0;
    return 'hsl(' + (Math.abs(hash) % 360) + ',55%,40%)';
  }
  function initials(name){
    const words = name.trim().split(/\s+/).filter(Boolean);
    if(words.length===0) return '?';
    if(words.length===1) return words[0].slice(0,3).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }
  function logoHtml(ch){
    const color = nameColor(ch.name);
    const init = escapeHtml(initials(ch.name));
    const fallback = '<span class="ch-logo-fallback" style="display:' + (ch.logo ? 'none' : 'flex') + '">' + init + '</span>';
    const img = ch.logo
      ? '<img src="' + escapeHtml(ch.logo) + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
      : '';
    return '<span class="ch-logo" style="background:' + color + '">' + img + fallback + '</span>';
  }
  function setStatus(text, isError){
    els.status.textContent = text;
    els.status.classList.toggle('error', !!isError);
  }

  /* ---------------- playlist parsing ---------------- */
  function parseM3U(text){
    const lines = text.split(/\r?\n/);
    const result = [];
    let pending = null;
    for(let raw of lines){
      const line = raw.trim();
      if(!line) continue;
      if(line.startsWith('#EXTINF')){
        const groupMatch = line.match(/group-title="([^"]*)"/);
        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
        const idMatch = line.match(/tvg-id="([^"]*)"/);
        const nameMatch = line.match(/,(.*)$/);
        pending = {
          group: groupMatch ? (groupMatch[1].trim() || 'Без категории') : 'Без категории',
          logo: logoMatch ? logoMatch[1] : null,
          tvgId: idMatch ? idMatch[1] : null,
          name: nameMatch ? nameMatch[1].trim() : 'Канал',
        };
      } else if(line.startsWith('#')){
        continue;
      } else if(pending){
        pending.url = line;
        result.push(pending);
        pending = null;
      }
    }
    return result;
  }

  async function fetchPlaylist(url){
    setStatus('Загрузка плейлиста…');
    try{
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const parsed = parseM3U(text);
      if(parsed.length === 0) throw new Error('в файле не найдено ни одного канала');
      channels = parsed;
      channels.forEach((ch, i) => { ch.number = String(i + 1).padStart(3, '0'); });
      currentCategory = null;
      renderCategories();
      renderChannelList();
      setStatus(channels.length + ' каналов загружено');
      zoneState.idx.categories = 0;
      zoneState.idx.channels = 0;
      if(channels.length > 0){
        focusAndPlay(0);
      } else {
        setFocus('channels', 0);
      }
    }catch(err){
      console.error(err);
      setStatus('Не удалось загрузить плейлист: ' + err.message, true);
    }
  }

  /* ---------------- categories & channel list ---------------- */
  function filteredIndices(){
    if(!currentCategory) return channels.map((_, i) => i);
    const res = [];
    channels.forEach((ch, i) => { if(ch.group === currentCategory) res.push(i); });
    return res;
  }

  function renderCategories(){
    const groups = [];
    const seen = new Set();
    channels.forEach(ch => { if(!seen.has(ch.group)){ seen.add(ch.group); groups.push(ch.group); } });
    let html = '<button class="cat-chip focusable' + (!currentCategory ? ' active' : '') + '" data-group="" tabindex="-1">Все<span class="cat-chip-count">' + channels.length + '</span></button>';
    groups.forEach(g => {
      const count = channels.filter(c => c.group === g).length;
      html += '<button class="cat-chip focusable' + (currentCategory === g ? ' active' : '') + '" data-group="' + escapeHtml(g) + '" tabindex="-1">' + escapeHtml(g) + '<span class="cat-chip-count">' + count + '</span></button>';
    });
    els.categories.innerHTML = html;
  }

  function channelRowHtml(globalIndex){
    const ch = channels[globalIndex];
    const isPlaying = globalIndex === currentIndex;
    const radioTag = isAudioUrl(ch.url) ? '<span class="row-tag">FM</span>' : '';
    const liveTag = isPlaying ? '<span class="row-live"><span class="row-live-dot"></span>В ЭФИРЕ</span>' : '';
    return '<div class="channel-row focusable' + (isPlaying ? ' playing' : '') + '" data-index="' + globalIndex + '" tabindex="-1">' +
      logoHtml(ch) +
      '<div class="row-main">' +
        '<div class="row-name">' + escapeHtml(ch.name) + '</div>' +
        '<div class="row-meta"><span class="row-group">' + escapeHtml(ch.group) + '</span>' + radioTag + '</div>' +
      '</div>' +
      '<div class="row-right">' + liveTag + '<span class="row-num">№' + ch.number + '</span></div>' +
    '</div>';
  }

  function renderChannelList(){
    const indices = filteredIndices();
    if(indices.length === 0){
      els.channelList.innerHTML = '<div class="rail-status">Каналы не найдены</div>';
      return;
    }
    els.channelList.innerHTML = indices.map(channelRowHtml).join('');
  }

  function selectCategory(group){
    currentCategory = group;
    renderCategories();
    renderChannelList();
    setFocus('channels', 0);
  }

  /* ---------------- focus / remote navigation ---------------- */
  function elementsOfZone(zone){
    if(zone === 'header') return [els.playlistToggle];
    if(zone === 'controls') return [els.playPauseBtn, els.muteBtn, els.fullscreenBtn];
    if(zone === 'error') return [els.retryBtn, els.nextBtn];
    if(zone === 'categories') return Array.from(els.categories.children);
    if(zone === 'channels') return Array.from(els.channelList.querySelectorAll('.channel-row'));
    return [];
  }

  function setFocus(zone, index){
    document.querySelectorAll('.focused').forEach(e => e.classList.remove('focused'));
    const arr = elementsOfZone(zone);
    if(arr.length === 0) return;
    const clamped = Math.max(0, Math.min(index, arr.length - 1));
    zoneState.zone = zone;
    zoneState.idx[zone] = clamped;
    const el = arr[clamped];
    el.classList.add('focused');
    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function refreshFocus(){
    setFocus(zoneState.zone, zoneState.idx[zoneState.zone]);
  }

  function focusAndPlay(globalIndex){
    let pos = filteredIndices().indexOf(globalIndex);
    if(pos < 0){
      currentCategory = null;
      renderCategories();
      renderChannelList();
      pos = filteredIndices().indexOf(globalIndex);
    }
    zoneState.zone = 'channels';
    zoneState.idx.channels = Math.max(0, pos);
    playChannel(globalIndex);
  }

  function onDirection(dir){
    const zone = zoneState.zone;
    const i = zoneState.idx[zone];

    if(zone === 'header'){
      if(dir === 'down') setFocus('categories', zoneState.idx.categories || 0);
      return;
    }
    if(zone === 'controls' || zone === 'error'){
      const arr = elementsOfZone(zone);
      if(dir === 'left'){ if(i > 0) setFocus(zone, i - 1); }
      else if(dir === 'right'){
        if(i < arr.length - 1) setFocus(zone, i + 1);
        else if(zone === 'controls') setFocus('categories', zoneState.idx.categories || 0);
      } else if(dir === 'up' && zone === 'controls'){ setFocus('header', 0); }
      return;
    }
    if(zone === 'categories'){
      const arr = elementsOfZone('categories');
      if(dir === 'left'){ if(i > 0) setFocus('categories', i - 1); else setFocus('controls', zoneState.idx.controls || 0); }
      else if(dir === 'right'){ if(i < arr.length - 1) setFocus('categories', i + 1); }
      else if(dir === 'up'){ setFocus('header', 0); }
      else if(dir === 'down'){ setFocus('channels', 0); }
      return;
    }
    if(zone === 'channels'){
      const arr = elementsOfZone('channels');
      if(dir === 'up'){ if(i > 0) setFocus('channels', i - 1); else setFocus('categories', zoneState.idx.categories || 0); }
      else if(dir === 'down'){ if(i < arr.length - 1) setFocus('channels', i + 1); }
      else if(dir === 'left'){ setFocus('controls', zoneState.idx.controls || 0); }
      return;
    }
  }

  function onEnter(){
    const zone = zoneState.zone;
    const i = zoneState.idx[zone];
    if(zone === 'header'){ togglePlaylist(); return; }
    if(zone === 'controls'){
      if(i === 0) els.playPauseBtn.click();
      else if(i === 1) els.muteBtn.click();
      else if(i === 2) els.fullscreenBtn.click();
      return;
    }
    if(zone === 'error'){
      if(i === 0) els.retryBtn.click(); else els.nextBtn.click();
      return;
    }
    if(zone === 'categories'){
      const chip = elementsOfZone('categories')[i];
      if(chip) selectCategory(chip.dataset.group || null);
      return;
    }
    if(zone === 'channels'){
      const row = elementsOfZone('channels')[i];
      if(row) playChannel(Number(row.dataset.index));
      return;
    }
  }

  function onBack(){
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    if(!digitBuffer && zoneState.zone !== 'channels'){
      const pos = currentIndex >= 0 ? filteredIndices().indexOf(currentIndex) : 0;
      setFocus('channels', pos >= 0 ? pos : 0);
      return;
    }
    if(currentCategory){ selectCategory(null); }
  }

  document.addEventListener('keydown', (e) => {
    if(e.key >= '0' && e.key <= '9'){ handleDigit(e.key); e.preventDefault(); return; }
    switch(e.key){
      case 'ArrowUp': onDirection('up'); e.preventDefault(); break;
      case 'ArrowDown': onDirection('down'); e.preventDefault(); break;
      case 'ArrowLeft': onDirection('left'); e.preventDefault(); break;
      case 'ArrowRight': onDirection('right'); e.preventDefault(); break;
      case 'Enter': onEnter(); e.preventDefault(); break;
      case 'Backspace':
      case 'Escape': onBack(); e.preventDefault(); break;
    }
  });

  /* ---------------- numeric channel entry ---------------- */
  function handleDigit(d){
    digitBuffer += d;
    if(digitBuffer.length > 3) digitBuffer = digitBuffer.slice(-3);
    els.numpad.textContent = digitBuffer;
    els.numpad.classList.remove('hidden');
    clearTimeout(digitTimer);
    digitTimer = setTimeout(commitDigitBuffer, 1200);
  }
  function hideNumpad(){ els.numpad.classList.add('hidden'); digitBuffer = ''; }
  function commitDigitBuffer(){
    const num = parseInt(digitBuffer, 10);
    digitBuffer = '';
    if(!num){ hideNumpad(); return; }
    const targetIndex = channels.findIndex(c => parseInt(c.number, 10) === num);
    if(targetIndex === -1){
      els.numpad.textContent = '№' + num + ' — нет канала';
      setTimeout(hideNumpad, 1200);
      return;
    }
    focusAndPlay(targetIndex);
    hideNumpad();
  }

  /* ---------------- playback ---------------- */
  function activeMediaEl(){
    return els.audioFace.classList.contains('hidden') ? els.video : els.audioEl;
  }
  function syncCustomControls(){
    const el = activeMediaEl();
    const playing = !el.paused && !el.ended;
    els.playIcon.classList.toggle('hidden', playing);
    els.pauseIcon.classList.toggle('hidden', !playing);
    const muted = el.muted || el.volume === 0;
    els.volumeIcon.classList.toggle('hidden', muted);
    els.muteIcon.classList.toggle('hidden', !muted);
  }

  function describeHlsError(data){
    if(data && data.type === 'networkError'){
      return 'Сервер потока не отвечает или блокирует запросы. Канал может работать в обычном IPTV-плеере, но не в этом браузере.';
    }
    if(data && data.type === 'mediaError'){
      return 'Поток повреждён или формат не поддерживается.';
    }
    return 'Не удалось воспроизвести этот канал.';
  }

  function showError(message){
    els.loading.classList.add('hidden');
    els.errorDetail.textContent = message;
    els.errorBox.classList.remove('hidden');
    els.tvControls.classList.add('hidden');
    setFocus('error', 0);
  }

  function stopAll(){
    if(hls){ hls.destroy(); hls = null; }
    els.video.removeAttribute('src');
    els.video.load();
    els.audioEl.pause();
    els.audioEl.removeAttribute('src');
    els.embedFrame.src = 'about:blank';
    els.embedFrame.classList.add('hidden');
    isEmbedActive = false;
  }

  function getEmbedInfo(url){
    if(/(^|\.)vk(video)?\.(com|ru)\/(video_ext\.php|video-)/i.test(url)){
      return { type: 'vk', embedUrl: url };
    }
    const rutubeId = url.match(/rutube\.ru\/(?:play\/embed\/|video\/)([a-z0-9]+)/i);
    if(rutubeId){
      return { type: 'rutube', embedUrl: 'https://rutube.ru/play/embed/' + rutubeId[1] + '/' };
    }
    return null;
  }

  function playVideo(url){
    els.loading.classList.remove('hidden');
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(els.video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        els.loading.classList.add('hidden');
        els.video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (_evt, data) => {
        if(data.fatal) showError(describeHlsError(data));
      });
    } else if(els.video.canPlayType('application/vnd.apple.mpegurl')){
      els.video.src = url;
      els.video.addEventListener('loadedmetadata', () => els.loading.classList.add('hidden'), { once: true });
      els.video.play().catch(err => showError('Не удалось запустить поток: ' + err.message));
    } else {
      showError('Браузер не поддерживает воспроизведение HLS-потоков.');
    }
  }
  els.video.addEventListener('error', () => { if(!hls) showError('Не удалось воспроизвести этот канал.'); });

  function showOSD(ch){
    clearTimeout(osdTimer);
    els.osdNum.textContent = '№' + ch.number;
    els.osdName.textContent = ch.name;
    els.osdGroup.textContent = ch.group;
    els.osd.classList.remove('hidden');
    els.osd.style.animation = 'none';
    requestAnimationFrame(() => { els.osd.style.animation = ''; });
    osdTimer = setTimeout(() => els.osd.classList.add('hidden'), 3200);
  }

  function flashSwitch(){
    els.screen.classList.add('switching');
    requestAnimationFrame(() => {
      setTimeout(() => els.screen.classList.remove('switching'), 90);
    });
  }

  function playChannel(index){
    const ch = channels[index];
    if(!ch) return;
    currentIndex = index;
    flashSwitch();
    showOSD(ch);
    if(zoneState.zone === 'error') setFocus('controls', 0);
    els.placeholder.classList.add('hidden');
    els.errorBox.classList.add('hidden');
    els.tvControls.classList.remove('hidden');
    stopAll();

    const embed = getEmbedInfo(ch.url);
    if(embed){
      isEmbedActive = true;
      els.video.classList.add('hidden');
      els.audioFace.classList.add('hidden');
      els.audioEl.classList.add('hidden');
      els.tvControls.classList.add('hidden');
      els.embedFrame.classList.remove('hidden');
      els.embedFrame.src = embed.embedUrl;
    } else if(isAudioUrl(ch.url)){
      isEmbedActive = false;
      els.video.classList.add('hidden');
      els.audioFace.classList.remove('hidden');
      els.audioEl.classList.remove('hidden');
      els.audioEl.src = ch.url;
      els.audioEl.play().catch(err => showError('Радиопоток не воспроизводится: ' + err.message));
      syncCustomControls();
    } else {
      isEmbedActive = false;
      els.audioFace.classList.add('hidden');
      els.audioEl.classList.add('hidden');
      els.video.classList.remove('hidden');
      playVideo(ch.url);
      syncCustomControls();
    }

    renderChannelList();
    refreshFocus();
  }

  /* ---------------- player controls ---------------- */
  els.playPauseBtn.addEventListener('click', () => {
    const el = activeMediaEl();
    if(el.paused){ el.play().catch(() => {}); } else { el.pause(); }
  });
  els.muteBtn.addEventListener('click', () => {
    const el = activeMediaEl();
    el.muted = !el.muted;
    syncCustomControls();
  });
  els.fullscreenBtn.addEventListener('click', () => {
    if(document.fullscreenElement){ document.exitFullscreen(); }
    else if(els.screen.requestFullscreen){ els.screen.requestFullscreen(); }
  });
  document.addEventListener('fullscreenchange', () => {
    const isFs = !!document.fullscreenElement;
    els.fsEnterIcon.classList.toggle('hidden', isFs);
    els.fsExitIcon.classList.toggle('hidden', !isFs);
  });
  [els.video, els.audioEl].forEach(el => {
    el.addEventListener('play', syncCustomControls);
    el.addEventListener('pause', syncCustomControls);
    el.addEventListener('volumechange', syncCustomControls);
  });
  els.retryBtn.addEventListener('click', () => { if(currentIndex >= 0) playChannel(currentIndex); });
  els.nextBtn.addEventListener('click', () => { if(channels.length > 0) focusAndPlay((currentIndex + 1) % channels.length); });

  /* ---------------- mouse / touch fallback ---------------- */
  els.channelList.addEventListener('click', (e) => {
    const row = e.target.closest('.channel-row');
    if(!row) return;
    const idx = Number(row.dataset.index);
    const pos = filteredIndices().indexOf(idx);
    zoneState.zone = 'channels';
    zoneState.idx.channels = pos < 0 ? 0 : pos;
    playChannel(idx);
  });
  els.categories.addEventListener('click', (e) => {
    const chip = e.target.closest('.cat-chip');
    if(chip) selectCategory(chip.dataset.group || null);
  });

  /* ---------------- playlist toggle & clock ---------------- */
  function togglePlaylist(){
    currentPlaylistKey = currentPlaylistKey === 'main' ? 'kids' : 'main';
    els.playlistToggle.querySelector('.pl-label').textContent =
      currentPlaylistKey === 'main' ? 'Основной плейлист' : 'Детский плейлист';
    fetchPlaylist(PLAYLISTS[currentPlaylistKey]);
  }
  els.playlistToggle.addEventListener('click', togglePlaylist);

  function updateClock(){
    const d = new Date();
    els.clock.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  updateClock();
  setInterval(updateClock, 15000);

  /* ---------------- boot ---------------- */
  setFocus('channels', 0);
  fetchPlaylist(PLAYLISTS.main);
</script>
</body>
</html>
